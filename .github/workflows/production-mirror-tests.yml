name: Production mirror receiver tests
on:
  pull_request:
    paths:
      - 'src/TimewebProductionMirror.js'
      - 'src/TimewebProductionExport.js'
      - 'tests/production-mirror.cjs'
      - 'tests/production-migration-link.cjs'
      - 'src/TimewebProductionMigrationLink.js'
      - 'src/SheetService.js'
      - 'src/NotificationService.js'
      - 'tests/constructor-notification.cjs'
      - 'src/TimewebConstructorSql.js'
      - 'tests/constructor-sql.cjs'
      - 'src/OrderService.js'
      - 'src/GoogleDriveService.js'
      - 'src/Api.js'
      - 'src/Code.js'
      - 'src/Config.js'
      - 'tests/release-version.cjs'
      - 'scripts/check-source.cjs'
      - '.github/workflows/production-mirror-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/constructor-notification.cjs
      - run: node tests/constructor-sql.cjs
      - run: node scripts/check-source.cjs
      - run: node tests/release-version.cjs
      - run: node --check src/TimewebProductionMirror.js
      - run: node tests/production-mirror.cjs
      - run: node --check src/TimewebProductionMigrationLink.js
      - run: node tests/production-migration-link.cjs
