<style>
  :root {
    --primary-color: #5C6BC0;
    --bg-color: #f4f6f8;
    --card-bg: #ffffff;
    --text-main: #333333;
    --text-secondary: #666666;
    --border-radius: 12px;
    --shadow: 0 4px 12px rgba(0, 0, 0, 0.08);
    
    /* Цвета стадий */
    --stage-sergey: #9e9e9e;       /* Серый */
    --stage-manager: #2196f3;      /* Синий */
    --stage-client: #ff9800;       /* Оранжевый */
    --stage-designer: #9c27b0;     /* Фиолетовый */
    --stage-workshop: #4caf50;     /* Зеленый */
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    background-color: var(--bg-color);
    color: var(--text-main);
    line-height: 1.5;
    padding-bottom: 40px;
  }

  /* --- ШАПКА --- */
  .app-header {
    background: var(--card-bg);
    padding: 20px 24px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    position: sticky;
    top: 0;
    z-index: 100;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 15px;
  }

  .header-title-group {
    display: flex;
    flex-direction: column;
    gap: 5px;
  }

  .app-title {
    font-size: 24px;
    font-weight: 700;
    color: var(--primary-color);
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .header-meta {
    font-size: 14px;
    color: var(--text-secondary);
    display: flex;
    gap: 15px;
    align-items: center;
  }

  .auto-save-badge {
    background: #e8f5e9;
    color: #2e7d32;
    padding: 4px 10px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 5px;
  }

  .header-controls {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }

  .btn-filter {
    padding: 8px 16px;
    border: 1px solid #ddd;
    background: white;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 500;
    transition: all 0.2s;
    color: var(--text-main);
  }

  .btn-filter:hover {
    background: #f5f5f5;
    border-color: #ccc;
    transform: translateY(-1px);
  }

  .btn-filter.active {
    background: var(--primary-color);
    color: white;
    border-color: var(--primary-color);
  }

  /* --- КОНТЕЙНЕР --- */
  .container {
    max-width: 1400px;
    margin: 24px auto;
    padding: 0 20px;
  }

  /* --- КАРТОЧКИ СТАТИСТИКИ --- */
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 20px;
    margin-bottom: 30px;
  }

  .stat-card {
    background: var(--card-bg);
    border-radius: var(--border-radius);
    padding: 20px;
    box-shadow: var(--shadow);
    transition: transform 0.2s;
    border-left: 5px solid transparent;
  }

  .stat-card:hover {
    transform: translateY(-3px);
  }

  .stat-card.manager { border-left-color: #ec407a; }
  .stat-card.designer { border-left-color: #ab47bc; }

  .stat-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 15px;
    font-size: 18px;
    font-weight: 600;
  }

  .stat-badges {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 6px 12px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 600;
  }

  .badge-total { background: #e3f2fd; color: #1565c0; }
  .badge-tz { background: #fff3e0; color: #ef6c00; }
  .badge-proforma { background: #f3e5f5; color: #7b1fa2; }
  .badge-kd { background: #e8f5e9; color: #2e7d32; }

  /* --- ТАБЛИЦА --- */
  .table-section {
    background: var(--card-bg);
    border-radius: var(--border-radius);
    box-shadow: var(--shadow);
    overflow: hidden;
    margin-bottom: 30px;
  }

  .table-header-block {
    padding: 15px 20px;
    border-bottom: 1px solid #eee;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #fafafa;
  }

  .table-title {
    font-size: 18px;
    font-weight: 600;
    color: var(--text-main);
  }

  .orders-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 14px;
  }

  .orders-table th {
    text-align: left;
    padding: 12px 20px;
    background: #f8f9fa;
    color: var(--text-secondary);
    font-weight: 600;
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    border-bottom: 2px solid #eee;
  }

  .orders-table td {
    padding: 16px 20px;
    border-bottom: 1px solid #f0f0f0;
    vertical-align: middle;
  }

  .orders-table tr:last-child td {
    border-bottom: none;
  }

  .orders-table tr:hover {
    background-color: #fcfcfc;
  }

  /* Колонки */
  .col-date { width: 100px; font-weight: 500; color: var(--text-secondary); }
  .col-order { font-weight: 600; color: var(--text-main); }
  .col-person { width: 150px; }
  .col-stage { width: 320px; }
  .col-notes { width: 200px; color: var(--text-secondary); font-style: italic; }

  .date-day {
    display: block;
    font-size: 11px;
    text-transform: uppercase;
    color: #999;
    margin-bottom: 2px;
  }

  .date-num {
    font-size: 16px;
    font-weight: 700;
  }

  /* --- КНОПКИ СТАДИЙ --- */
  .stage-group {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  .stage-btn {
    padding: 6px 12px;
    border: none;
    border-radius: 6px;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
    opacity: 0.6;
    transform: scale(0.95);
    color: white;
  }

  .stage-btn:hover {
    opacity: 0.8;
    transform: scale(1);
  }

  .stage-btn.active {
    opacity: 1;
    transform: scale(1.05);
    box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    font-weight: 700;
  }

  /* Цвета кнопок */
  .stage-sergey { background-color: var(--stage-sergey); }
  .stage-manager { background-color: var(--stage-manager); }
  .stage-client { background-color: var(--stage-client); }
  .stage-designer { background-color: var(--stage-designer); }
  .stage-workshop { background-color: var(--stage-workshop); }

  /* --- БЛОК ЗАМЕТОК --- */
  .notes-block {
    background: #fff8e1;
    border-left: 4px solid #ffc107;
    padding: 15px 20px;
    margin: 0;
    display: flex;
    align-items: flex-start;
    gap: 12px;
    color: #5d4037;
    font-size: 14px;
  }

  .notes-icon {
    font-size: 18px;
  }

  /* Адаптивность */
  @media (max-width: 768px) {
    .app-header {
      flex-direction: column;
      align-items: flex-start;
    }
    
    .header-controls {
      width: 100%;
      justify-content: flex-start;
    }

    .orders-table {
      font-size: 12px;
    }

    .stage-group {
      gap: 4px;
    }

    .stage-btn {
      padding: 4px 8px;
      font-size: 11px;
    }
    
    .col-stage {
      min-width: 280px;
    }
  }
</style>
