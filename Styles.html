<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    color:#222;
}

.header{

    height:64px;

    background:#5C6BC0;

    color:white;

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:0 18px;

    font-size:22px;

    font-weight:bold;

}

.refresh{

}

.queue-item{

    display:flex;

    align-items:center;

    margin:14px;

    padding:18px;

}

.queue-date{

    width:84px;

    text-align:center;

    border-right:1px solid #e5e5e5;

    margin-right:18px;

    padding-right:18px;

}

.weekday{

    font-size:22px;

    font-weight:bold;

    color:#666;

}

.date{

    font-size:26px;

    font-weight:bold;

    margin-top:6px;

}

.queue-body{

    flex:1;

}

.product{

    font-size:28px;

    font-weight:bold;

    line-height:1.25;

}

.stage{

    margin-top:10px;

    font-size:20px;

    color:#1976d2;

    font-weight:bold;

}

.manager{

    margin-top:8px;

    font-size:20px;

    color:#666;

}

.app{
    padding:16px;
}

.app-header{
    font-size:24px;
    font-weight:bold;
    margin-bottom:16px;
}


.table-container{
    background:white;
    border-radius:12px;
    overflow:hidden;
    box-shadow:0 2px 8px rgba(0,0,0,.1);
}


.queue-table{
    width:100%;
    border-collapse:collapse;
}


.queue-table th{

    background:#f3f4f6;

    text-align:left;

    padding:12px;

    font-size:16px;

    font-weight:bold;

}


.queue-table td{

}


.queue-table tr:last-child td{
    border-bottom:none;
}


.date-cell{

    width:90px;

    text-align:center;

}


.weekday{

    font-size:14px;

    font-weight:bold;

}


.date{

    font-weight:bold;

}


.order-cell{

    font-weight:500;

}


.col-order{

}


.col-constructor{

}


.col-stage{
    width:15%;
}


.col-comment{
    width:25%;
}

    display:flex;

    gap:20px;

    align-items:end;

    padding:16px;

    background:white;

    border-radius:12px;

    margin-bottom:12px;

}

    display:flex;

    flex-direction:column;

    gap:5px;

}

    font-size:14px;

    color:#666;

    border:1px solid #ccc;

}

    border:none;

    border-radius:8px;

    background:#1976d2;

    color:white;

    font-size:16px;

}

    display:flex;

    gap:20px;

    margin-bottom:16px;

}



.stat{

    background:white;

    padding:12px 20px;

    border-radius:12px;

}



.stat span{

    display:block;

    font-size:24px;

    font-weight:bold;

}


.stat small{
