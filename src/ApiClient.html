    static runQueueAction(actionName, ...args) {
        if (Store.isAppVersionOutdated()) {
            return Promise.reject(new Error("APP_VERSION_MISMATCH|client=" + String(window.APP_VERSION || "unknown") + "|server=unknown"));
        }
        return this.run("runQueueAction", actionName, args, Store.getSection(), window.APP_VERSION);
    }

                .withSuccessHandler(resolve)
                .withFailureHandler(reject)[method](...args);
        });
