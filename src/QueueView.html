        });
}

static closeOrderFiles() {
    document.getElementById("orderFilesModal").classList.add("hidden");
    this.selectedOrderKey = "";
    this.orderFilesBySection = {};
    this.selectedMeasurementFileId = "";
    this.clearMeasurementPreview();
}

static getDefaultFileSection(order) {
    const stage = String(order.stage || "").trim();
    if (stage === "КД") return "КД";
    if (["Проформа", "Согласование"].includes(stage)) return "Проформа";
    return "ТЗ";
}

static setFileSection(section) {
    if (!["ТЗ", "Замер", "Проформа", "КД"].includes(section)) return;
    this.selectedFileSection = section;
    document.getElementById("orderFileInput").value = "";
    this.selectedMeasurementFileId = "";
    this.clearMeasurementPreview();
    this.renderSelectedOrderFiles();
    this.updateFileSectionUi();
    this.renderOrderFiles();
}

static updateFileSectionUi() {
    document.querySelectorAll("[data-file-section]").forEach(button => {
        const active = button.dataset.fileSection === this.selectedFileSection;
        button.classList.toggle("active", active);
        button.setAttribute("aria-selected", String(active));
    });
    const label = document.getElementById("orderFileUploadLabel");
    if (label) label.textContent = `Добавить файл в ${this.selectedFileSection}`;
}

static renderSelectedOrderFiles() {
    const input = document.getElementById("orderFileInput");
    const list = document.getElementById("selectedOrderFiles");
    if (!input || !list) return;
    const files = Array.from(input.files || []);
    if (!files.length) {
        list.innerHTML = "";
        list.classList.remove("visible");
        return;
    }
    const title = files.length === 1 ? "Выбран файл:" : `Выбрано файлов: ${files.length}`;
    list.innerHTML = `<span class="selected-order-files-title">${title}</span><ul>${files.map(file =>
        `<li>${this.escapeHtml(file.name)}</li>`
    ).join("")}</ul>`;
    list.classList.add("visible");
}

static renderOrderFiles() {
    const list = document.getElementById("orderFilesList");
    const browser = document.getElementById("orderFilesBrowser");
    const preview = document.getElementById("orderFilesPreview");
    const files = this.orderFilesBySection[this.selectedFileSection] || [];
    const isMeasurement = this.selectedFileSection === "Замер";
    const archiveButton = document.getElementById("downloadMeasurementsArchive");
    archiveButton.classList.toggle("hidden", !isMeasurement);
    archiveButton.disabled = !files.length || Boolean(this.measurementArchiveLoading);
    browser.classList.toggle("measurement", isMeasurement);
    preview.classList.toggle("hidden", !isMeasurement);
    list.classList.toggle("measurement-gallery", isMeasurement);
    if (!files || !files.length) {
        list.textContent = `В разделе «${this.selectedFileSection}» пока нет файлов.`;
        if (isMeasurement) preview.textContent = "Выберите фотографию для предпросмотра.";
        return;
    }
    if (isMeasurement) {
        this.renderMeasurementGallery(files);
        return;
    }
    list.innerHTML = files.map(file =>
        `<div class="order-file-item">
            <button class="order-file-open" data-preview-file="${this.escapeHtml(file.id)}">${this.escapeHtml(file.name)}</button>
            <button class="download-file-btn" data-download-file="${this.escapeHtml(file.id)}" title="Скачать на компьютер">⇩ Скачать</button>
            <button class="delete-file-btn" data-delete-file="${this.escapeHtml(file.id)}" title="Переместить файл в корзину">Удалить</button>
        </div>`
    ).join("");
    list.querySelectorAll("[data-preview-file]").forEach(button => {
        const file = files.find(item => item.id === button.dataset.previewFile);
        button.onclick = () => isMeasurement
            ? this.showMeasurementPreview(file)
            : this.openFilePreview(file);
    });
    list.querySelectorAll("[data-download-file]").forEach(button => {
        button.onclick = () => this.downloadOrderFile(button.dataset.downloadFile, button);
    });
    this.bindDeleteOrderFileButtons(files);
}

static renderMeasurementGallery(files) {
    const list = document.getElementById("orderFilesList");
    const preview = document.getElementById("orderFilesPreview");
    const images = files.filter(file => this.isPreviewableImage(file));
    const selected = images.find(file => file.id === this.selectedMeasurementFileId) || images[0];
    this.selectedMeasurementFileId = selected ? selected.id : "";
    list.classList.add("measurement-gallery");
    list.innerHTML = files.map(file => `<div class="measurement-file-item">
        <button type="button" class="measurement-thumb ${selected && file.id === selected.id ? "active" : ""}" ${this.isPreviewableImage(file) ? `data-measurement-file="${this.escapeHtml(file.id)}"` : `data-measurement-document="${this.escapeHtml(file.id)}"`} title="${this.escapeHtml(file.name)}">${this.isPreviewableImage(file) ? `<img alt="" data-thumbnail-file="${this.escapeHtml(file.id)}">` : '<span class="measurement-document-icon" aria-hidden="true">📄</span>'}<span class="measurement-thumb-name">${this.escapeHtml(file.name)}</span></button>
        <button type="button" class="download-file-btn measurement-download-file" data-download-file="${this.escapeHtml(file.id)}">⇩ Скачать</button>
        <button type="button" class="delete-file-btn measurement-delete-file" data-delete-file="${this.escapeHtml(file.id)}" title="Переместить файл в корзину">Удалить</button>
    </div>`).join("");
    list.querySelectorAll("[data-measurement-file]").forEach(button => {
        button.onclick = () => this.showMeasurementPreview(images.find(file => file.id === button.dataset.measurementFile));
    });
    list.querySelectorAll("[data-measurement-document]").forEach(button => {
        button.onclick = () => this.openFilePreview(files.find(file => file.id === button.dataset.measurementDocument));
    });
    list.querySelectorAll("[data-download-file]").forEach(button => { button.onclick = () => this.downloadOrderFile(button.dataset.downloadFile, button); });
    this.bindDeleteOrderFileButtons(files);
    images.forEach(file => this.loadMeasurementThumbnail(file));
    if (selected) this.showMeasurementPreview(selected);
    else preview.textContent = "В разделе нет изображений для предпросмотра.";
}

static downloadMeasurementArchive() {
    const button = document.getElementById("downloadMeasurementsArchive");
    const key = this.selectedOrderKey;
    if (!key || this.measurementArchiveLoading) return;
    this.measurementArchiveLoading = true;
    button.disabled = true;
    button.textContent = "Подготовка архива…";
    QueueController.downloadMeasurementArchive(key).then(file => {
        const bytes = atob(file.base64);
        const values = new Uint8Array(bytes.length);
        for (let index = 0; index < bytes.length; index++) values[index] = bytes.charCodeAt(index);
        const url = URL.createObjectURL(new Blob([values], { type: file.mimeType }));
        const link = document.createElement("a");
        link.href = url; link.download = file.name; document.body.appendChild(link); link.click(); link.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
    }).catch(error => this.showMessage(error)).finally(() => {
        this.measurementArchiveLoading = false;
        button.textContent = "⇩ Скачать всё (ZIP)";
        button.disabled = !(this.orderFilesBySection["Замер"] || []).length;
    });
}

static bindDeleteOrderFileButtons(files) {
    document.getElementById("orderFilesList").querySelectorAll("[data-delete-file]").forEach(button => {
        const file = files.find(item => item.id === button.dataset.deleteFile);
        button.onclick = () => this.deleteOrderFile(file, button);
    });
}

static deleteOrderFile(file, button) {
    if (!file) return;
    if (!window.confirm(`Удалить файл «${file.name}»?\n\nФайл будет перемещён в корзину Google Drive.`)) return;
    button.disabled = true;
    button.textContent = "Удаление…";
    QueueController.deleteOrderFile(this.selectedOrderKey, this.selectedFileSection, file.id)
        .then(() => QueueController.getOrderFiles(this.selectedOrderKey))
        .then(updatedFilesBySection => {
            if (this.selectedMeasurementFileId === file.id) {
                this.selectedMeasurementFileId = "";
                this.clearMeasurementPreview();
            }
            this.orderFilesBySection = updatedFilesBySection || {};
            this.renderOrderFiles();
        })
        .catch(error => {
            button.disabled = false;
            button.textContent = "Удалить";
            this.showMessage(error);
        });
}

static loadMeasurementThumbnail(file) {
    const image = document.querySelector(`[data-thumbnail-file="${CSS.escape(file.id)}"]`);
    if (!image || image.dataset.loaded === "true") return;
    QueueController.getOrderFileThumbnail(this.selectedOrderKey, this.selectedFileSection, file.id)
        .then(thumbnail => {
            if (!document.body.contains(image)) return;
            image.src = `data:${thumbnail.mimeType || "image/jpeg"};base64,${thumbnail.base64}`;
            image.dataset.loaded = "true";
        })
        .catch(() => { image.alt = "Превью недоступно"; });
}

static isPreviewableImage(file) {
    return String(file && file.mimeType || "").toLowerCase().startsWith("image/");
}

static clearMeasurementPreview() {
    if (this.measurementPreviewUrl) URL.revokeObjectURL(this.measurementPreviewUrl);
    this.measurementPreviewUrl = "";
    const preview = document.getElementById("orderFilesPreview");
    if (preview) preview.textContent = "";
}

static getFileBlob(file) {
    return QueueController.downloadOrderFile(this.selectedOrderKey, this.selectedFileSection, file.id)
        .then(payload => {
            const bytes = atob(payload.base64);
            const values = new Uint8Array(bytes.length);
            for (let index = 0; index < bytes.length; index++) values[index] = bytes.charCodeAt(index);
            return new Blob([values], { type: payload.mimeType || file.mimeType || "application/octet-stream" });
        });
}

static showMeasurementPreview(file) {
    const preview = document.getElementById("orderFilesPreview");
    if (!file || !preview) return;
    this.selectedMeasurementFileId = file.id;
    document.querySelectorAll("[data-measurement-file]").forEach(button => {
        button.classList.toggle("active", button.dataset.measurementFile === file.id);
    });
    if (!this.isPreviewableImage(file)) {
        this.clearMeasurementPreview();
        preview.textContent = "Предпросмотр доступен для фотографий. Для этого файла используйте скачивание.";
        return;
    }
    preview.textContent = "Загрузка предпросмотра…";
    this.getFileBlob(file)
        .then(blob => {
            this.clearMeasurementPreview();
            this.measurementPreviewUrl = URL.createObjectURL(blob);
            preview.innerHTML = `<button type="button" title="Открыть в полном размере"><img src="${this.measurementPreviewUrl}" alt="${this.escapeHtml(file.name)}"></button>`;
            preview.querySelector("button").onclick = () => this.openFilePreview(file, blob);
        })
        .catch(error => { preview.textContent = error.message || error; });
}

static openFilePreview(file, readyBlob) {
    if (!file) return;
    const modal = document.getElementById("filePreviewModal");
    const title = document.getElementById("filePreviewTitle");
    const content = document.getElementById("filePreviewContent");
    title.textContent = file.name;
    content.textContent = "Загрузка файла…";
    modal.classList.remove("hidden");
    const render = blob => {
        const mimeType = String(blob.type || file.mimeType || "").toLowerCase();
        const url = URL.createObjectURL(blob);
        if (mimeType.startsWith("image/")) {
            content.innerHTML = `<img src="${url}" alt="${this.escapeHtml(file.name)}">`;
        } else if (mimeType === "application/pdf") {
            content.innerHTML = `<iframe src="${url}" title="${this.escapeHtml(file.name)}"></iframe>`;
        } else {
            URL.revokeObjectURL(url);
            content.innerHTML = `<div class="file-preview-unavailable">Предпросмотр этого формата недоступен. Используйте кнопку «Скачать».</div>`;
        }
    };
    if (readyBlob) {
        render(readyBlob);
        return;
    }
    this.getFileBlob(file).then(render).catch(error => {
        content.textContent = error.message || error;
    });
}

static closeFilePreview() {
    document.getElementById("filePreviewModal").classList.add("hidden");
    document.getElementById("filePreviewContent").innerHTML = "";
}

static uploadOrderFile() {
    const input = document.getElementById("orderFileInput");
    const files = Array.from(input.files || []);
    if (!files.length) return this.showMessage("Выберите файл.");
    const tooLarge = files.find(file => file.size > 20 * 1024 * 1024);
    if (tooLarge) return this.showMessage(`Файл «${tooLarge.name}» больше 20 МБ.`);

    const button = document.getElementById("uploadOrderFileBtn");
    button.disabled = true;
    const orderKey = this.selectedOrderKey;
    const section = this.selectedFileSection;
    files.reduce((chain, file, index) => chain.then(() => {
            button.textContent = `Загрузка ${index + 1}/${files.length}…`;
            return this.readFileAsBase64(file).then(payload => QueueController.uploadOrderFile(orderKey, section, payload));
        }), Promise.resolve())
        .then(() => QueueController.getOrderFiles(this.selectedOrderKey))
        .then(updatedFilesBySection => {
            this.orderFilesBySection = updatedFilesBySection || {};
            this.renderOrderFiles();
            input.value = "";
            this.renderSelectedOrderFiles();
        })
        .catch(error => this.showMessage(error))
        .finally(() => { button.disabled = false; button.textContent = "Загрузить файлы"; });
}

static readFileAsBase64(file) {
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve({
            name: file.name,
            mimeType: file.type,
            base64: String(reader.result).split(",")[1]
        });
        reader.onerror = () => reject(new Error(`Не удалось прочитать файл «${file.name}».`));
        reader.readAsDataURL(file);
    });
}

static createBasisSpecification(input, button) {
    const file = Array.from(input.files || [])[0];
    if (!file) return;
    if (!/\.xml$/i.test(file.name)) {
        input.value = "";
        this.showMessage(new Error("Выберите XML-файл БАЗИС."));
        return;
    }
    if (file.size > 10 * 1024 * 1024) {
        input.value = "";
        this.showMessage(new Error(`Файл «${file.name}» больше 10 МБ.`));
        return;
    }
    const originalText = button.textContent;
    button.disabled = true;
    button.textContent = "Создаём спецификацию…";
    this.readFileAsBase64(file)
        .then(payload => QueueController.createBasisSpecification(payload))
        .then(result => this.downloadExcelFile(result))
        .catch(error => this.showMessage(error))
        .finally(() => {
            input.value = "";
            button.disabled = false;
            button.textContent = originalText;
        });
}

static downloadOrderFile(fileId, button) {
    button.disabled = true;
    button.textContent = "Скачивание…";
    QueueController.downloadOrderFile(this.selectedOrderKey, this.selectedFileSection, fileId)
        .then(file => {
            const bytes = atob(file.base64);
            const values = new Uint8Array(bytes.length);
            for (let index = 0; index < bytes.length; index++) values[index] = bytes.charCodeAt(index);
            const blob = new Blob([values], { type: file.mimeType || "application/octet-stream" });
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            link.href = url;
            link.download = file.name;
            document.body.appendChild(link);
            link.click();
            link.remove();
            URL.revokeObjectURL(url);
        })
        .catch(error => this.showMessage(error))
        .finally(() => { button.disabled = false; button.textContent = "⇩ Скачать"; });
}

    this.productionAfterSave = afterSave;

    document.getElementById("productionDaysFacadeType").textContent =

    document.getElementById("productionDaysTitle").textContent = hourly ? "Параметры расчёта Малярки" : "Длительности операций";
    document.getElementById("legacyProductionDaysGrid").classList.toggle("hidden", hourly);
    document.getElementById("hourlyPaintingParameters").classList.toggle("hidden", !hourly);
    document.getElementById("hourlyFacadeTypeField").classList.toggle("hidden", !hourly);
    document.getElementById("hourlyPolishingAreaField").classList.toggle("hidden", !hourly);
    document.getElementById("hourlyBackPaintingAreaField").classList.toggle("hidden", !hourly);
    document.getElementById("hourlyFrontPaintingAreaField").classList.toggle("hidden", !hourly);
    const days = order.productionDays || {};
    document.getElementById("paintingArea").value = order.paintingArea || "";
    document.getElementById("backPaintingArea").value = order.backPaintingArea || "";
    document.getElementById("frontPaintingArea").value = order.frontPaintingArea || "";
    document.getElementById("polishingArea").value = order.polishingArea || "";
    document.getElementById("prodPreparation").value = days.preparation || "";
    document.getElementById("prodPrimer1").value = days.primer1 || "";
    document.getElementById("prodSanding1").value = days.sanding1 || "";
    document.getElementById("prodPrimer2").value = days.primer2 || "";
    document.getElementById("prodSanding2").value = days.sanding2 || "";
    document.getElementById("prodBackPainting").value = days.backPainting || "";
    document.getElementById("prodMasking").value = days.masking || "";
    document.getElementById("prodFrontPainting").value = days.frontPainting || "";
    document.getElementById("prodPreLacquerSanding").value = days.preLacquerSanding || "";
    document.getElementById("prodLacquer").value = days.lacquer || "";
    document.getElementById("prodPolishing").value = days.polishing || "";
    const exclusions = order.routeExclusions || {};
    [
        ["excludePrimer2", "prodPrimer2", "primer2"],
        ["excludeSanding2", "prodSanding2", "sanding2"],
        ["excludeBackPainting", "prodBackPainting", "backPainting"],
        ["excludeMasking", "prodMasking", "masking"]
    ].forEach(([checkboxId, inputId, keyName]) => {
        const checkbox = document.getElementById(checkboxId);
        const input = document.getElementById(inputId);
        checkbox.checked = Boolean(exclusions[keyName]);
        input.disabled = checkbox.checked;
        checkbox.onchange = () => {
            input.disabled = checkbox.checked;
            if (!hourly) this.renderLegacyPaintingNorms();
        };
    });
    const lacquerCheckbox = document.getElementById("includeLacquerOperations");
    const lacquerInputs = ["prodPreLacquerSanding", "prodLacquer", "prodPolishing"]
        .map(id => document.getElementById(id));
    const toggleLacquerInputs = () => {
        lacquerInputs.forEach(input => { input.disabled = !lacquerCheckbox.checked; });
    };
    lacquerCheckbox.checked = Boolean(order.lacquerOperations);
    lacquerCheckbox.onchange = () => {
        toggleLacquerInputs();
        if (!hourly) this.renderLegacyPaintingNorms();
    };
    toggleLacquerInputs();
    if (hourly) {
        document.getElementById("hourlyFacadeType").value = order.facadeType || "";
        const exclusions = order.routeExclusions || {};
        document.getElementById("hourlyExcludePrimer2").checked = Boolean(exclusions.primer2);
        document.getElementById("hourlyExcludeSanding2").checked = Boolean(exclusions.sanding2);
        document.getElementById("hourlyExcludeBackPainting").checked = Boolean(exclusions.backPainting);
        document.getElementById("hourlyExcludeMasking").checked = Boolean(exclusions.masking);
        document.getElementById("hourlyIncludeLacquer").checked = Boolean(order.lacquerOperations);
        ["paintingArea", "backPaintingArea", "frontPaintingArea", "polishingArea", "hourlyFacadeType", "hourlyExcludePrimer2", "hourlyExcludeSanding2",
            "hourlyExcludeBackPainting", "hourlyExcludeMasking", "hourlyIncludeLacquer"]
            .map(id => document.getElementById(id)).filter(Boolean)
            .forEach(input => input.oninput = input.onchange = () => this.renderPaintingNormPreview());
        this.renderPaintingNormPreview();
    } else {
        this.legacyPaintingNormOrder = order;
        ["paintingArea", "backPaintingArea", "frontPaintingArea", "polishingArea"]
            .map(id => document.getElementById(id)).filter(Boolean)
            .forEach(input => input.oninput = input.onchange = () => this.renderLegacyPaintingNorms());
        this.renderLegacyPaintingNorms();
    }
    document.querySelectorAll("[data-operation-norm-details]").forEach(button => {
        button.onclick = event => {
            event.preventDefault();
            event.stopPropagation();
            this.openOperationNormDetails(button.dataset.operationNormDetails);
        };
    });
    document.getElementById("productionDaysModal").classList.remove("hidden");
}

static renderLegacyPaintingNorms() {
    const config = Store.state.paintingNorms;
    const order = this.legacyPaintingNormOrder;
    const outputs = Array.from(document.querySelectorAll("[data-operation-norm]"));
    if (!outputs.length) return;
    this.legacyPaintingNormDetails = {};
    const stageFor = output => {
        const label = output.closest("label");
        const stage = label && label.firstElementChild;
        return stage ? String(stage.textContent || "").trim() : "Операция";
    };
    const setUnavailable = (output, message) => {
        output.textContent = "—";
        output.classList.add("is-unavailable");
        output.title = message;
        this.legacyPaintingNormDetails[output.dataset.operationNorm] = {
            available: false,
            stage: stageFor(output),
            reason: message
        };
    };
    if (!config || !order) {
        outputs.forEach(output => setUnavailable(output, "Нормы Малярки пока не загружены."));
        return;
    }
    const facadeType = String(order.facadeType || "").trim();
    const profile = (config.profiles || []).find(item => item.active && (item.facadeTypes || []).includes(facadeType));
    if (!profile) {
        outputs.forEach(output => setUnavailable(output, "Для типа фасада не назначен нормативный профиль."));
        return;
    }
    const commonPaintingArea = Number(document.getElementById("paintingArea").value);
    const areas = {
        painting: commonPaintingArea,
        back: Number(document.getElementById("backPaintingArea").value),
        front: Number(document.getElementById("frontPaintingArea").value),
        polishing: Number(document.getElementById("polishingArea").value)
    };
    const excluded = {
        primer2: document.getElementById("excludePrimer2").checked,
        sanding2: document.getElementById("excludeSanding2").checked,
        backPainting: document.getElementById("excludeBackPainting").checked,
        masking: document.getElementById("excludeMasking").checked
    };
    const lacquerIncluded = document.getElementById("includeLacquerOperations").checked;
    const operationByCode = (config.operations || []).reduce((result, operation) => {
        result[operation.taskType] = operation;
        return result;
    }, {});
    const explicitRoute = profile.routeOperations || [];
    const areaLabels = {
        painting: "Укажите общую площадь грунтования/покраски.",
        back: "Укажите площадь тыльной стороны.",
        front: "Укажите площадь лица и торцов.",
        polishing: "Укажите площадь полировки."
    };
    outputs.forEach(output => {
        const code = output.dataset.operationNorm;
        const operation = operationByCode[code];
        if (!operation || !operation.active) {
            setUnavailable(output, "Операция отключена в нормативах.");
            return;
        }
        if (excluded[code]) {
            setUnavailable(output, "Операция исключена из маршрута.");
            return;
        }
        if (explicitRoute.length && !explicitRoute.includes(code)) {
            setUnavailable(output, "Операция не входит в маршрут выбранного профиля.");
            return;
        }
        if (!explicitRoute.length && operation.group === "lacquer" && !lacquerIncluded) {
            setUnavailable(output, "Лаковая группа не добавлена в маршрут.");
            return;
        }
        const norm = (config.norms || []).find(item => item.profile === profile.code && item.operation === code);
        if (!norm || norm.fixedMinutes === null || norm.minutesPerSqm === null) {
            setUnavailable(output, "Норма для этой операции не заполнена.");
            return;
        }
        const areaBasis = norm.areaBasis || "painting";
        // В legacy-карточке есть одна общая площадь. Раздельные площади нужны только
        // для более точного почасового режима, поэтому до его включения используем
        // общую площадь как безопасное основание для всех операций.
        const specificArea = areas[areaBasis];
        const area = specificArea > 0 ? specificArea : commonPaintingArea;
        if (!(area > 0)) {
            setUnavailable(output, areaLabels.painting);
            return;
        }
        const rawMinutes = Math.round((Number(norm.fixedMinutes) + Number(norm.minutesPerSqm) * area) * 10) / 10;
        const calendarMinutes = Math.ceil(rawMinutes / 5) * 5;
        output.textContent = `${(rawMinutes / 60).toLocaleString("ru-RU", { maximumFractionDigits: 1 })} ч`;
        output.classList.remove("is-unavailable");
        const areaSource = specificArea > 0 && areaBasis !== "painting"
            ? "использована отдельная площадь операции"
            : "использована общая площадь покраски";
        output.title = `Профиль: ${profile.name || profile.code}. Расчёт: ${rawMinutes.toLocaleString("ru-RU")} мин; ${areaSource}. Для календаря: ${calendarMinutes.toLocaleString("ru-RU")} мин.`;
        this.legacyPaintingNormDetails[code] = {
            available: true,
            stage: operation.stage || stageFor(output),
            profile: profile.name || profile.code,
            fixedMinutes: Number(norm.fixedMinutes),
            minutesPerSqm: Number(norm.minutesPerSqm),
            areaBasis,
            area,
            areaSource,
            rawMinutes,
            calendarMinutes,
            normHours: rawMinutes / 60
        };
    });
}

static renderPaintingNormPreview() {
    const container = document.getElementById("paintingNormPreview");
    const config = Store.state.paintingNorms;
    if (!container || !config) return;
    const area = Number(document.getElementById("paintingArea").value);
    const backArea = Number(document.getElementById("backPaintingArea").value);
    const frontArea = Number(document.getElementById("frontPaintingArea").value);
    const polishingArea = Number(document.getElementById("polishingArea").value);
    const facadeType = document.getElementById("hourlyFacadeType").value;
    const profile = (config.profiles || []).find(item => item.active && (item.facadeTypes || []).includes(facadeType));
    const excluded = {
        primer2: document.getElementById("hourlyExcludePrimer2").checked,
        sanding2: document.getElementById("hourlyExcludeSanding2").checked,
        backPainting: document.getElementById("hourlyExcludeBackPainting").checked,
        masking: document.getElementById("hourlyExcludeMasking").checked
    };
    const lacquer = document.getElementById("hourlyIncludeLacquer").checked;
    if (!(area > 0) || !profile) {
        container.innerHTML = `<p class="norm-error" style="padding:12px">${!(area > 0) ? "Укажите площадь покраски." : "Для выбранного типа фасада не назначен профиль."}</p>`;
        return;
    }
    let totalRaw = 0;
    let totalRounded = 0;
    const allOperations = config.operations || [];
    const explicitRoute = profile.routeOperations || [];
    const operationByCode = allOperations.reduce((result, operation) => {
        result[operation.taskType] = operation;
        return result;
    }, {});
    const routeOperations = explicitRoute.length
        ? explicitRoute.map(code => operationByCode[code]).filter(Boolean)
        : allOperations;
    const lacquerToggle = document.getElementById("hourlyIncludeLacquer");
    lacquerToggle.disabled = explicitRoute.length > 0;
    if (explicitRoute.length) lacquerToggle.checked = explicitRoute.some(code => {
        const operation = operationByCode[code];
        return operation && operation.group === "lacquer";
    });
    const rows = routeOperations.filter(operation => operation.active &&
        !excluded[operation.taskType] && (explicitRoute.length || operation.group !== "lacquer" || lacquer)
    ).map(operation => {
        const norm = (config.norms || []).find(item => item.profile === profile.code && item.operation === operation.taskType);
        const complete = norm && norm.fixedMinutes !== null && norm.minutesPerSqm !== null;
        if (!complete) return `<tr><td>${this.escapeHtml(operation.stage)}</td><td colspan="3" class="norm-error">Норма не заполнена</td></tr>`;
        const areaByBasis = { painting: area, back: backArea, front: frontArea, polishing: polishingArea };
        const labelByBasis = {
            painting: "Укажите общую площадь грунтования/покраски",
            back: "Укажите площадь тыльной стороны",
            front: "Укажите площадь лица и торцов",
            polishing: "Укажите площадь полировки"
        };
        const normArea = areaByBasis[norm.areaBasis || "painting"];
        if (!(normArea > 0)) {
            const label = labelByBasis[norm.areaBasis || "painting"] || labelByBasis.painting;
            return `<tr><td>${this.escapeHtml(operation.stage)}</td><td colspan="3" class="norm-error">${label}</td></tr>`;
        }
        const raw = Math.round((Number(norm.fixedMinutes) + Number(norm.minutesPerSqm) * normArea) * 10) / 10;
        const rounded = Math.ceil(raw / 5) * 5;
        totalRaw += raw;
        totalRounded += rounded;
        return `<tr><td>${this.escapeHtml(operation.stage)}</td><td>${raw.toLocaleString("ru-RU")} мин</td><td>${rounded.toLocaleString("ru-RU")} мин</td><td>${(raw / 60).toLocaleString("ru-RU", { maximumFractionDigits: 1 })} ч</td></tr>`;
    });
    container.innerHTML = `<table><thead><tr><th>Операция</th><th>Расчёт</th><th>В календаре</th><th>Нормо-часы</th></tr></thead><tbody>${rows.join("")}<tr class="norm-total"><td>Итого</td><td>${totalRaw.toLocaleString("ru-RU", { maximumFractionDigits: 1 })} мин</td><td>${totalRounded.toLocaleString("ru-RU")} мин</td><td>${(totalRaw / 60).toLocaleString("ru-RU", { maximumFractionDigits: 1 })} ч</td></tr></tbody></table>`;
}

static collectPaintingNorms() {
    const source = this.paintingNormConfig || { profiles: [], operations: [], norms: [] };
    const profiles = Array.from(document.querySelectorAll("[data-norm-profile]")).map((row, index) => ({
        code: source.profiles[index].code,
        name: row.querySelector("[data-profile-name]").value.trim(),
        facadeTypes: row.querySelector("[data-profile-types]").value.split(",").map(value => value.trim()).filter(Boolean),
        routeOperations: row.querySelector("[data-profile-route]").value.split(",").map(value => value.trim()).filter(Boolean),
        active: row.querySelector("[data-profile-active]").checked
    }));
    const operations = Array.from(document.querySelectorAll("[data-norm-operation]")).map((row, index) => {
        const code = row.dataset.operationCode || "";
        return {
            taskType: code,
            originalCode: code,
            stage: row.querySelector("[data-operation-name]").value.trim(),
            role: row.querySelector("[data-operation-role]").value,
            order: Number(row.querySelector("[data-operation-order]").value) || (index + 1) * 10,
            group: row.querySelector("[data-operation-group]").value,
            active: row.querySelector("[data-operation-active]").checked
        };
    });
    const norms = [];
    operations.forEach((operation, operationIndex) => profiles.forEach((profile, profileIndex) => {
        const fixedInput = document.querySelector(`[data-norm-fixed][data-operation-index="${operationIndex}"][data-profile-index="${profileIndex}"]`);
        const perInput = document.querySelector(`[data-norm-per][data-operation-index="${operationIndex}"][data-profile-index="${profileIndex}"]`);
        const basisInput = document.querySelector(`[data-norm-basis][data-operation-index="${operationIndex}"][data-profile-index="${profileIndex}"]`);
        const oldNorm = (source.norms || []).find(item => item.profile === profile.code && item.operation === operation.taskType) || {};
        norms.push({
            profile: profile.code,
            operation: operation.taskType,
            fixedMinutes: fixedInput && fixedInput.value !== "" ? Number(fixedInput.value) : null,
            minutesPerSqm: perInput && perInput.value !== "" ? Number(perInput.value) : null,
            areaBasis: basisInput && ["painting", "back", "front", "polishing"].includes(basisInput.value) ? basisInput.value : "painting",
            comment: oldNorm.comment || ""
        });
    }));
    return { profiles, operations, norms };
}

static validatePaintingNormsClient(payload) {
    const errors = [];
    const activeProfiles = payload.profiles.filter(profile => profile.active && profile.facadeTypes.length);
    const activeOperations = payload.operations.filter(operation => operation.active);
    activeProfiles.forEach(profile => {
        const routeCodes = profile.routeOperations || [];
        const profileOperations = routeCodes.length
            ? routeCodes.map(code => activeOperations.find(operation => operation.taskType === code)).filter(Boolean)
            : activeOperations;
        if (!profileOperations.length) errors.push(`Маршрут не задан — ${profile.name}`);
        profileOperations.forEach(operation => {
        const norm = payload.norms.find(item => item.profile === profile.code && item.operation === operation.taskType);
        if (!norm || norm.fixedMinutes === null || norm.minutesPerSqm === null) errors.push(`${operation.stage} — ${profile.name}`);
        });
    });
    return errors;
}

static renderPaintingNormValidation() {
    const box = document.getElementById("paintingNormValidation");
    if (!box) return;
    const payload = this.collectPaintingNorms();
    const missing = this.validatePaintingNormsClient(payload);
    box.classList.toggle("valid", missing.length === 0);
    box.textContent = missing.length
        ? `Нельзя включить часовой режим. Не заполнены нормы:\n${missing.slice(0, 12).join("\n")}${missing.length > 12 ? `\n…и ещё ${missing.length - 12}` : ""}`
        : "Все активные операции и профили заполнены.";
}

static addPaintingNormOperation() {
    const payload = this.collectPaintingNorms();
    const nextIndex = payload.operations.length + 1;
    const tempCode = "new_" + Date.now();
    payload.operations.push({ taskType: tempCode, originalCode: "", stage: "Новая операция", role: "sanding", order: nextIndex * 10, group: "main", active: true });
    payload.profiles.forEach(profile => payload.norms.push({ profile: profile.code, operation: tempCode, fixedMinutes: null, minutesPerSqm: null, areaBasis: "painting", comment: "" }));
    this.paintingNormConfig = Object.assign({}, this.paintingNormConfig, payload);
    this.renderPaintingNormsEditor();
}

    const initialLabel = button.textContent;
    button.disabled = true;
    button.textContent = "Сохраняем…";
    this.setPaintingNormSaveState("Сохраняем изменения в лист «Нормы Малярка»…");
    const payload = this.collectPaintingNorms();
    QueueController.savePaintingNorms(payload)
        .then(config => {
            this.paintingNormConfig = config;
            Store.state.paintingNorms = config;
            this.renderPaintingNormsEditor();
            this.setPaintingNormSaveState("Нормы сохранены в Google Sheets.", "success");
        })
        .catch(error => {
            const message = String(error && error.message ? error.message : error || "Не удалось сохранить нормы.");
            console.error("Не удалось сохранить нормы Малярки:", error);
            this.setPaintingNormSaveState(`Нормы не сохранены: ${message}`, "error");
        })
        .finally(() => {
            button.disabled = false;
            button.textContent = initialLabel;
        });
}

static changeWorkStatus(key, action, button) {
    if (action === "pause") {
        this.openPauseComment(key);
        return;
    }
    button.disabled = true;
    QueueController.changeWorkStatus(key, action)
        .catch(error => {
            console.error(error);
            const message = error.message || String(error);
            // Очередь может измениться в другом окне: например, менеджер уже
            // перевёл Проформу на согласование. Сразу перечитываем данные,
            // чтобы конструктор не видел устаревшую кнопку Play.
            if (message.includes("Заказ уже изменился") || message.includes("Заказ не найден")) {
                QueueController.load().finally(() => this.showMessage(message));
                return;
            }
            this.showMessage(message);
        })
        .finally(() => { button.disabled = false; });
}

static openPauseComment(key, taskType) {
    const pending = this.pauseTarget;
    const order = this.orders.find(item => item.key === key && (!taskType || item.taskType === taskType)) ||
        this.orders.find(item => item.key === key);
    if (!order) return;
    this.selectedOrderKey = key;
    const isInstallationCommentEdit = pending && pending.type === "installation-comment";
    const isClaimCommentEdit = pending && pending.type === "claim-comment";
    const isClaimTransfer = pending && pending.type === "claim-transfer";
    document.getElementById("pauseCommentTitle").textContent = (isClaimCommentEdit || isClaimTransfer) ? "Комментарий рекламации" : isInstallationCommentEdit ? "Комментарий монтажа" : "Причина паузы";
    document.getElementById("pauseCommentLabel").textContent = isClaimTransfer ? "Комментарий (необязательно)" : "Комментарий";
    document.getElementById("savePauseComment").textContent = isClaimTransfer ? "Перевести в рекламацию" : (isInstallationCommentEdit || isClaimCommentEdit) ? "Сохранить комментарий" : "Поставить на паузу";
    document.getElementById("pauseOrderName").textContent =
        [order.contract, order.client, order.product].filter(Boolean).join(" • ");
    document.getElementById("pauseComment").placeholder = isClaimTransfer ? "Опишите суть рекламации (необязательно)" : "Что требуется для продолжения работы?";
    document.getElementById("pauseComment").value = isClaimTransfer ? "" : isClaimCommentEdit ? (order.claimComment || "") : (order.comment || "");
    document.getElementById("pauseCommentModal").classList.remove("hidden");
}

static closePauseComment() {
    document.getElementById("pauseCommentModal").classList.add("hidden");
    document.getElementById("pauseCommentTitle").textContent = "Причина паузы";
    document.getElementById("pauseCommentLabel").textContent = "Комментарий";
    document.getElementById("pauseComment").placeholder = "Что требуется для продолжения работы?";
    document.getElementById("savePauseComment").textContent = "Поставить на паузу";
    this.pauseTarget = null;
}

static openInstallationComment(key, taskType) {
    this.pauseTarget = { key, taskType, type: "installation-comment" };
    this.openPauseComment(key, taskType);
}

static openClaimComment(key) {
    this.pauseTarget = { key, type: "claim-comment" };
    this.openPauseComment(key);
}

static confirmPause() {
    const comment = document.getElementById("pauseComment").value.trim();
    const isClaimTransfer = this.pauseTarget && this.pauseTarget.type === "claim-transfer";
    if (!comment && !isClaimTransfer) {
        const type = this.pauseTarget && this.pauseTarget.type;
        this.showMessage(type === "claim-comment" ? "Укажите суть рекламации."
            : type === "installation-comment" ? "Укажите комментарий монтажа."
            : "Укажите причину паузы.");
        return;
    }
    const button = document.getElementById("savePauseComment");
    button.disabled = true;
    const pending = this.pauseTarget;
    const request = pending && pending.type === "claim-comment"
        ? QueueController.saveClaimComment(pending.key, comment)
        : pending && pending.type === "claim-transfer"
            ? QueueController.sendOrderToClaims(pending.key, pending.taskType, comment)
        : pending && pending.type === "installation-comment"
            ? QueueController.saveInstallationComment(pending.key, pending.taskType, comment)
        : pending && pending.type === "manufacturing"
            ? QueueController.changeManufacturingStatus(pending.key, pending.taskType, "pause", comment)
        : pending && pending.type === "sanding"
        ? QueueController.changeSandingStatus(pending.key, pending.taskType, "pause", comment, pending.branch)
        : pending && pending.type === "painting"
            ? QueueController.changePaintingStatus(pending.key, pending.taskType, "pause", comment, pending.branch)
            : QueueController.changeWorkStatus(this.selectedOrderKey, "pause", comment);
    request
        .then(() => {
            this.closePauseComment();
            if (isClaimTransfer) this.showSuccessMessage("Монтаж завершён, изделие передано в «Рекламации».");
        })
        .catch(error => {
            console.error(error);
            this.showMessage(error);
        })
        .finally(() => { button.disabled = false; });
}

static changeManagerStage(key, stage, button) {
    button.disabled = true;
    QueueController.advanceManagerStage(key, stage)
        .catch(error => {
            console.error(error);
            this.showMessage(error);
            button.disabled = false;
        });
}

static reviewTechnologistOrder(key, action, button) {
    const findByKey = selector => Array.from(document.querySelectorAll(selector))
        .find(element => element.dataset.key === key);
    const constructor = findByKey("[data-tech-constructor]")?.value || "";
    const proformaDays = findByKey("[data-tech-proforma-days]")?.value || "";
    const kdDays = findByKey("[data-tech-kd-days]")?.value || "";

    button.disabled = true;
    QueueController.reviewByTechnologist(key, action, constructor, proformaDays, kdDays)
        .catch(error => {
            console.error(error);
            this.showMessage(error);
            button.disabled = false;
        });
}

static renderTotalOrdersByConstructor() {

    const totalOrders = document.getElementById("totalOrders");

    if (!totalOrders) return;

    // Счётчик отражает только текущий раздел и выбранный фильтр. Резервные
    // операции одного изделия не увеличивают число заказов.
    const role = Store.getRole();
    if (role === "master") {
        totalOrders.textContent = `Изделий в работе: ${this.getFilteredOrders().length}`;
        return;
    }
    if (Store.getSection() === "malarka") {
        const visibleOrders = this.getFilteredOrders();
        const streams = new Map();
        visibleOrders.forEach(order => {
            const streamKey = `${order && (order.orderKey || order.key)}|${order && (order.paintingBranch || "legacy")}`;
            if (order && !streams.has(streamKey)) streams.set(streamKey, order);
        });
        const facadeTypes = Array.from(streams.values()).reduce((result, order) => {
            const facadeType = String(order.facadeType || "").trim() || "Не выбран";
            result[facadeType] = (result[facadeType] || 0) + (Number(order.paintingArea) || 0);
            return result;
        }, {});
        const total = this.sumUniquePaintingArea(visibleOrders);
        const byFacadeType = Object.keys(facadeTypes)
            .sort((left, right) => left.localeCompare(right, "ru"))
            .map(type => `${type}: ${this.formatPaintingArea(facadeTypes[type])}`)
            .join(" · ");
        totalOrders.textContent = `Площадь покраски: итого ${this.formatPaintingArea(total)}${byFacadeType ? " · " + byFacadeType : ""}`;
        return;
    }
    if (Store.getSection() === "production") {
        const summary = this.getManufacturingRoles()
            .filter(item => item.role !== "productionAll")
            .map(item => {
                const stages = new Set(this.getManufacturingStages(item.role));
                const count = new Set(this.orders
                    .filter(order => stages.has(String(order.stage || "").trim()))
                    .map(order => order.key)).size;
                return `${item.stage}: ${count}`;
            })
            .join(" · ");
        totalOrders.textContent = "Заказы по участкам: " + summary;
        return;
    }
    const visibleOrders = this.getFilteredOrders();
    const ownerField = role === "manager" || role === "allOrders" ? "manager" : "constructor";
    const groups = visibleOrders.reduce((result, order) => {
        const owner = String(order[ownerField] || "").trim();
        const group = owner || "Без исполнителя";
        if (!result[group]) result[group] = new Set();
        result[group].add(order.key);
        return result;
    }, {});
    const summary = Object.keys(groups)
        .sort((left, right) => left.localeCompare(right, "ru"))
        .map(owner => `${owner}: ${groups[owner].size}`)
        .join(" · ");

    totalOrders.textContent = summary
        ? "Всего заказов: " + summary
        : "Всего заказов: 0";

}

static sumUniquePaintingArea(orders) {
    const seen = new Set();
    return (orders || []).reduce((sum, order) => {
        const streamKey = `${order && (order.orderKey || order.key)}|${order && (order.paintingBranch || "legacy")}`;
        if (!order || seen.has(streamKey)) return sum;
        seen.add(streamKey);
        const area = Number(order.paintingArea) || 0;
        return sum + (Number.isFinite(area) && area > 0 ? area : 0);
    }, 0);
}

static formatPaintingArea(area) {
    return `${Number(area || 0).toLocaleString("ru-RU", { maximumFractionDigits: 2 })} м²`;
}

static openAddClaim() {
    ["claimSearch", "claimContract", "claimClient", "claimProduct", "claimCommentInput"].forEach(id => { document.getElementById(id).value = ""; });
    document.getElementById("claimMode").value = "existing";
    document.getElementById("claimManager").innerHTML = this.buildAddOrderOptions(this.getAvailableNames(["Менеджеры", "Менеджер"], "manager"), "Нет доступных менеджеров");
    this.claimCandidates = [];
    this.updateClaimForm();
    document.getElementById("addClaimModal").classList.remove("hidden");
    const select = document.getElementById("claimCandidate");
    select.innerHTML = '<option value="">Загрузка…</option>';
    google.script.run.withSuccessHandler(items => { this.claimCandidates = items || []; this.renderClaimCandidates(); })
        .withFailureHandler(error => { select.innerHTML = '<option value="">Не удалось загрузить изделия</option>'; this.showMessage(error); }).getClaimCandidates();
}

static updateClaimForm() {
    const isNew = document.getElementById("claimMode").value === "new";
    document.getElementById("claimCommentLabel").textContent = isNew ? "Комментарий рекламации (необязательно)" : "Комментарий рекламации";
    document.getElementById("claimExistingFields").classList.toggle("hidden", isNew);
    document.getElementById("claimNewFields").classList.toggle("hidden", !isNew);
    if (!isNew) this.renderClaimCandidates();
}

static renderClaimCandidates() {
    const query = document.getElementById("claimSearch").value.trim().toLocaleLowerCase("ru");
    const items = (this.claimCandidates || []).filter(item => [item.contract, item.client, item.product].join(" ").toLocaleLowerCase("ru").includes(query));
    document.getElementById("claimCandidate").innerHTML = '<option value="">Выберите изделие</option>' + items.map(item => `<option value="${this.escapeHtml(item.key)}">${this.escapeHtml([item.contract, item.client, item.product].join(" • "))}</option>`).join("");
}

static saveAddClaim() {
    const value = id => document.getElementById(id).value.trim();
    const data = { mode: value("claimMode"), key: value("claimCandidate"), contract: value("claimContract"), client: value("claimClient"), product: value("claimProduct"), manager: value("claimManager"), comment: value("claimCommentInput") };
    if ((data.mode === "existing" && (!data.key || !data.comment)) || (data.mode === "new" && (!data.client || !data.product || !data.manager))) { this.showMessage(data.mode === "existing" ? "Выберите изделие и укажите комментарий рекламации." : "Заполните клиента, изделие и менеджера."); return; }
    const button = document.getElementById("saveAddClaim");
    button.disabled = true;
    QueueController.addClaim(data).then(() => { document.getElementById("addClaimModal").classList.add("hidden"); this.showSuccessMessage("Рекламация добавлена."); })
        .catch(error => this.showMessage(error)).finally(() => { button.disabled = false; });
}

static openAddOrderModal(){


    const modal =
        document.getElementById("addOrderModal");


    if(!modal){
        return;
    }


    this.fillAddOrderLists();

    this.resetAddOrderForm();


    modal.classList.remove("hidden");


}



static closeAddOrderModal(){


    const modal =
        document.getElementById("addOrderModal");


    if(!modal){
        return;
    }


    modal.classList.add("hidden");


}



static fillAddOrderLists(){


    const managers = this.getAvailableNames(
        ["Менеджеры", "Менеджер"],
        "manager"
    );

    // Договоры и клиенты — не справочник ролей. Подсказки строим по уже
    // созданным заказам, при этом input остаётся свободным для нового значения.
    const contracts = this.getOrderFieldValues("contract");
    const clients = this.getOrderFieldValues("client");



    const managerSelect =
        document.getElementById("orderManager");


    if(managerSelect){

        managerSelect.innerHTML = this.buildAddOrderOptions(
            managers,
            "Нет доступных менеджеров"
        );

    }



    const clientList = document.getElementById("orderClientList");

    if (clientList) {
        clientList.innerHTML = clients.map(client =>
            `<option value="${this.escapeHtml(client)}"></option>`
        ).join("");
    }

    const contractList = document.getElementById("orderContractList");

    if (contractList) {
        contractList.innerHTML = contracts.map(contract =>
            `<option value="${this.escapeHtml(contract)}"></option>`
        ).join("");
    }


}

static getAvailableNames(dictionaryNames, orderField) {

    // Назначения конструкторов всегда берём из нового ролевого справочника,
    // а не из устаревшей колонки «Конструктор».
    if (dictionaryNames.includes("Конструкторы")) {
        return this.getRoleNames("Конструкторы");
    }

    const dictionaries = Store.state.dictionaries || {};
    const dictionaryValues = dictionaryNames.flatMap(name => dictionaries[name] || []);

    return [...new Set(dictionaryValues
        .map(value => String(value || "").trim())
        .filter(Boolean))]
        .sort((left, right) => left.localeCompare(right, "ru"));

}

static getRoleNames(dictionaryName) {
    const dictionaries = Store.state.dictionaries || {};
    const normalizedName = String(dictionaryName || "").trim().toLowerCase();
    const actualKey = Object.keys(dictionaries).find(key =>
        String(key || "").trim().toLowerCase() === normalizedName
    );
    return [...new Set((actualKey ? dictionaries[actualKey] : [])
        .map(value => String(value || "").trim())
        .filter(Boolean))]
        .sort((left, right) => left.localeCompare(right, "ru"));
}

static getOrderFieldValues(fieldName) {
    return [...new Set((this.orders || [])
        .map(order => String(order[fieldName] || "").trim())
        .filter(Boolean))]
        .sort((left, right) => left.localeCompare(right, "ru"));
}

static buildAddOrderOptions(names, emptyLabel) {

    if (!names.length) {
        return `<option value="" disabled selected>${emptyLabel}</option>`;
    }

    return names.map(name => {
        const safeName = this.escapeHtml(name);
        return `<option value="${safeName}">${safeName}</option>`;
    }).join("");

}

static escapeHtml(value) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/\"/g, "&quot;")
        .replace(/'/g, "&#039;");

}

static resetAddOrderForm() {

    ["orderContract", "orderClient", "orderProduct"].forEach(id => {
        document.getElementById(id).value = "";
    });
}

static saveAddOrder() {

    const saveButton = document.getElementById("saveAddOrder");
    const order = {
        contract: document.getElementById("orderContract").value,
        client: document.getElementById("orderClient").value,
        product: document.getElementById("orderProduct").value,
        manager: document.getElementById("orderManager").value
    };

    saveButton.disabled = true;
    saveButton.textContent = "Добавление...";

    QueueController.addOrder(order)
        .then(() => this.closeAddOrderModal())
        .catch(error => {
            console.error(error);
            this.showMessage(error);
        })
        .finally(() => {
            saveButton.disabled = false;
            saveButton.textContent = "Добавить";
        });

}

static openOrderActions(key, taskType) {

    const order = this.orders.find(item => item.key === key);
    const modal = document.getElementById("orderActionsModal");

    if (!order || !modal) return;

    this.selectedOrderKey = key;
    this.selectedTaskType = taskType || "proforma";
    document.getElementById("orderActionName").textContent =
        [order.contract, order.client, order.product].filter(Boolean).join(" • ");
    document.getElementById("moveOrderDate").value = "";
    document.getElementById("clearManualDateBtn").classList.toggle("hidden", !order.manualPriority);
    document.getElementById("editDurationValue").textContent = Number(order.duration || 1).toLocaleString("ru-RU");
    document.getElementById("assignmentField").classList.add("hidden");
    document.getElementById("durationField").classList.remove("hidden");
    document.getElementById("editDurationLabel").textContent =
        this.selectedTaskType === "kd" ? "Дни КД" : "Дни Проформы";
    document.getElementById("editDurationValue").textContent = Number(
        this.selectedTaskType === "kd" ? order.kdDays || order.duration : order.proformaDays || order.duration
    ).toLocaleString("ru-RU");

    const constructors = this.getAvailableNames(
        ["Конструкторы", "Конструктор"],
        "constructor"
    );
    const select = document.getElementById("assignConstructor");
    select.innerHTML = constructors.map(name => {
        const safeName = this.escapeHtml(name);
        return `<option value="${safeName}" ${name === order.constructor ? "selected" : ""}>${safeName}</option>`;
    }).join("");

    modal.classList.remove("hidden");

}

static closeOrderActions() {

    this.selectedOrderKey = "";
    document.getElementById("orderActionsModal").classList.add("hidden");

}

static moveOrderToDate() {

    const date = document.getElementById("moveOrderDate").value;

    if (!date) {
        this.showMessage("Выберите дату переноса.");
        return;
    }

    this.runOrderAction(
        "moveOrderBtn",
        "Изменить дату",
        () => QueueController.moveOrderToDate(this.selectedOrderKey, date)
    );

}

static clearManualOrderDate() {
    this.runOrderAction(
        "clearManualDateBtn",
        "Сбросить приоритет",
        () => QueueController.clearManualOrderDate(this.selectedOrderKey)
    );
}

static assignOrderConstructor() {

    const constructor = document.getElementById("assignConstructor").value;

    this.runOrderAction(
        "assignConstructorBtn",
        "Назначить конструктора",
        () => QueueController.assignOrderConstructor(this.selectedOrderKey, constructor)
    );

}

static changeEditDuration(delta) {
    const value = document.getElementById("editDurationValue");
    const current = Number(String(value.textContent).replace(",", ".")) || 0.5;
    value.textContent = (Math.max(0.5, Math.round((current + delta) * 2) / 2))
        .toLocaleString("ru-RU");
}

static saveOrderDuration() {
    const value = document.getElementById("editDurationValue");
    const duration = Number(String(value.textContent).replace(",", "."));
    this.runOrderAction(
        "saveDurationBtn",
        "Сохранить длительность",
        () => QueueController.changeConstructorTaskDays(this.selectedOrderKey, this.selectedTaskType, duration)
    );
}

static runOrderAction(buttonId, initialLabel, action) {

    const button = document.getElementById(buttonId);
    button.disabled = true;
    button.textContent = "Сохранение...";

    action()
        .then(() => this.closeOrderActions())
        .catch(error => {
            console.error(error);
            this.showMessage(error);
        })
        .finally(() => {
            button.disabled = false;
            button.textContent = initialLabel;
        });

}





}

</script>
