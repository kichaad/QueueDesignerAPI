    static getManufacturingRoles() {
        return [
            { role: "master", stage: "АРМ мастера", buttonId: "btnMaster" },

    static getInstallationRoles() {
        return [
            { role: "installationAll", stage: "Все монтажи", buttonId: "btnInstallationAll" },
            { role: "installation", stage: "Монтаж", buttonId: "btnInstallation" },
            { role: "delivered", stage: "Сданы", buttonId: "btnDelivered" }
        ];
    }

    static getOrderQueueRoles() {
        return [{ role: "allOrders", stage: "Все этапы", buttonId: "btnAllOrders" }];
    }

    static isManufacturingRole(role) {
        return this.getManufacturingRoles().concat(this.getInstallationRoles(), this.getOrderQueueRoles()).some(item => item.role === role);
    }

    static getManufacturingStage(role) {
        const item = this.getManufacturingRoles().concat(this.getInstallationRoles(), this.getOrderQueueRoles()).find(candidate => candidate.role === role);
        return item ? item.stage : "";
    }

    static getManufacturingStages(role) {
        if (role === "master") return ["Все изделия"];
        if (role === "productionAll") return ["Все в работе"];
        if (role === "launch") return ["Очередь", "Запуск"];
        if (role === "installationAll") return ["Все монтажи"];
        if (role === "sawing") return ["Распил ЛДСП", "Распил МДФ", "Распил Шпон"];
        if (role === "edging") return ["Кромка", "Кромка Шпон"];
        if (role === "cnc") return ["Фрезеровка", "Присадка", "Присадка Шпон"];
        if (role === "preparation") return ["Подготовка"];
        if (role === "packaging") return ["Упаковка Корпуса", "Упаковка Фасада"];
        if (role === "delivery") return ["СГП Корпуса", "СГП Фасада"];
        if (role === "delivered") return ["Монтаж", "Завершен"];
        if (role === "allOrders") return ["Все этапы"];
        return [this.getManufacturingStage(role)].filter(Boolean);
    }

EventBus.on("roleChanged", role => {

    const isPaintingSection = ["paintingAll", "processing", "sanding", "painting", "armSanding", "armPainting"].includes(role);

    const isInstallationSection = this.getInstallationRoles().some(item => item.role === role);

    const isEquipmentInvoicesSection = role === "equipmentInvoices";

    const isTabletopSection = role === "tabletops";

        static initFilters(orders) {

if (Store.getRole() === "purchase") {
    SupplyView.initFilters(orders);
    return;
}
if (Store.getRole() === "plate") {
    PlateMaterialView.initFilters(orders);
    return;
}
if (Store.getRole() === "supplierOrders") {
    SupplierOrdersView.initFilters(orders);
    return;
}
if (Store.getRole() === "equipment") {
    EquipmentView.initFilters(orders);
    return;
}
if (Store.getRole() === "equipmentInvoices") {
    EquipmentInvoicesView.initFilters(orders);
    return;
}
if (Store.getRole() === "tabletops") {
    TabletopView.initFilters(orders);
    return;
}

        if (!orders) {
            return;
        }

        const managers = this.getRoleNames("Менеджер");



        const constructors = this.getRoleNames("Конструкторы");



        const managerSelect =
            document.getElementById("managerFilter");



        const constructorSelect =
            document.getElementById("constructorFilter");




        if(managerSelect && managerSelect.options.length === 1){



            managers.forEach(name => {


                managerSelect.innerHTML += `


                    <option value="${name}">

                        ${name}

                    </option>


                `;


            });


        }





        if(constructorSelect && constructorSelect.options.length === 1){



            constructors.forEach(name => {


                constructorSelect.innerHTML += `


                    <option value="${name}">

                        ${name}

                    </option>


                `;


            });


        }

const role = Store.getRole();

const users =
    role === "manager"
        ? managers

   static getFilteredOrders(skipProductionFilters = false){

    if (Store.getRole() === "purchase") return SupplyView.getFilteredItems(this.orders);
    if (Store.getRole() === "plate") return PlateMaterialView.getFilteredItems(this.orders);
    if (Store.getRole() === "supplierOrders") return SupplierOrdersView.getFilteredItems(this.orders);

    let result = [...this.orders];


    const selectedUser =
        Store.getSelectedUser();


    const role =
        Store.getRole();



    if(selectedUser){


        if(role === "manager"){


            result = result.filter(order =>

                order.manager === selectedUser

            );


        } else if (["constructor", "sanding", "painting", "armSanding", "armPainting"].includes(role)) {


            result = result.filter(order =>

                order.constructor === selectedUser

            );


        }

    }

    if (role === "constructor") {
        result = result.filter(order => {
            const stage = String(order.stage || "").trim();
            if (stage === "Согласование") {
                // На согласовании у конструктора видна только ещё активная
                // виртуальная задача Проформы. Исходная завершённая строка
                // остаётся в ответе для менеджера, но сюда не попадает.
                return order.taskType === "proforma" &&
                    String(order.status || "").trim().toLowerCase() !== "готово";
            }
            return stage === "Проформа" || stage === "КД" || stage === "КД (резерв)";
        });

        // Календарь содержит по строке на каждый день длительного заказа.
        // В рабочем экране конструктора заказ должен быть показан один раз.
        const seen = new Set();
        result = result.filter(order => {
            const taskKey = order.key + "|" + (order.taskType || "order");
            if (seen.has(taskKey)) return false;
            seen.add(taskKey);
            return true;
        });

        // Согласование не занимает календарную мощность. Отображаем его сразу
        // после реально выполняемых задач, независимо от очереди резерва КД.
        result.sort((left, right) => {
            const group = order => {
                const stage = String(order.stage || "").trim();
                const status = String(order.status || "").trim().toLowerCase();
                if (stage !== "Согласование" && status === "в работе") return 0;
                if (stage === "Согласование") return 1;
                return 2;
            };
            return group(left) - group(right);
        });
    } else if (role === "paintingAll") {
        const seen = new Map();
        result.filter(order => {
            const stage = String(order.stage || "").replace(/ \(резерв\)$/, "").trim();
            return stage === "В покраску" || (Boolean(order.canStart) && !String(order.stage || "").includes("(резерв)"));
        }).forEach(order => {
            const branchKey = `${order.orderKey || order.key}|${order.paintingBranch || "legacy"}`;
            const previous = seen.get(branchKey);
            if (!previous || (order.canStart && !previous.canStart)) seen.set(branchKey, order);
        });
        result = Array.from(seen.values()).map(order => Object.assign({}, order, {
            displayStatus: this.getPaintingAllStatus(order)
        }));
        result.sort((left, right) => {
            const leftDeadline = this.getDeadlineSortValue(left.deadline);
            const rightDeadline = this.getDeadlineSortValue(right.deadline);
            if (leftDeadline === null && rightDeadline !== null) return -1;
            if (leftDeadline !== null && rightDeadline === null) return 1;
            return (leftDeadline || 0) - (rightDeadline || 0) || Number(left.queue || 0) - Number(right.queue || 0);
        });
    } else if (role === "armSanding" || role === "armPainting") {
        const requiredRole = role === "armSanding" ? "sanding" : "painting";
        result = result.filter(order =>
            order.productionRole === requiredRole &&
            Boolean(order.canStart) &&
            !String(order.stage || "").includes("(резерв)") &&
            String(order.status || "").trim().toLowerCase() !== "готово"
        ).map(order => Object.assign({}, order, {
            displayStatus: this.getArmPaintingStatus(order)
        }));
        const seen = new Set();
        result = result.filter(order => {
            const taskKey = (order.orderKey || order.key) + "|" + (order.paintingBranch || "legacy") + "|" + (order.taskType || "order");
            if (seen.has(taskKey)) return false;
            seen.add(taskKey);
            return true;
        });
        result.sort((left, right) => {
            const rank = item => {
                const status = String(item.status || "").trim().toLowerCase();
                return status === "в работе" ? 0 : status === "пауза" ? 1 : 2;
            };
            const leftDeadline = this.getDeadlineSortValue(left.deadline);
            const rightDeadline = this.getDeadlineSortValue(right.deadline);
            if (rank(left) !== rank(right)) return rank(left) - rank(right);
            if (Number(left.queue || 0) !== Number(right.queue || 0)) return Number(left.queue || 0) - Number(right.queue || 0);
            if (leftDeadline === null && rightDeadline !== null) return -1;
            if (leftDeadline !== null && rightDeadline === null) return 1;
            return (leftDeadline || 0) - (rightDeadline || 0);
        });
    } else if (role === "sanding") {
        const sandingStages = new Set(["Шлифовка 1 слой", "Шлифовка 2 слой", "Обклейка", "Шлифовка перед лаком"]);
        result = result.filter(order => sandingStages.has(String(order.stage || "").replace(/ \(резерв\)$/, "").trim()));
        const seen = new Set();
        result = result.filter(order => {
            const taskKey = order.key + "|" + (order.taskType || "order");
            if (seen.has(taskKey)) return false;
            seen.add(taskKey);
            return true;
        });
    } else if (role === "painting") {
        const paintingStages = new Set(["Грунт 1 слой", "Грунт 2 слой", "Покраска тыльной стороны", "Покраска лицевой стороны", "Лак", "Полировка"]);
        result = result.filter(order => paintingStages.has(String(order.stage || "").replace(/ \(резерв\)$/, "").trim()));
        const seen = new Set();
        result = result.filter(order => {
            const taskKey = order.key + "|" + (order.taskType || "order");
            if (seen.has(taskKey)) return false;
            seen.add(taskKey);
            return true;
        });
    } else if (role === "manager") {
        const managerStages = new Set(["ТЗ", "Согласование", "Правки"]);
        result = result.filter(order => managerStages.has(String(order.stage || "").trim()));

        const seen = new Set();
        result = result.filter(order => {
            if (seen.has(order.key)) return false;
            seen.add(order.key);
            return true;
        });
    } else if (role === "allOrders") {
        const seen = new Set();
        result = result.filter(order => {
            if (seen.has(order.key)) return false;
            seen.add(order.key);
            return true;
        });
        if (this.allOrdersClientFilter) {
            result = result.filter(order => String(order.client || "").trim() === this.allOrdersClientFilter);
        }
        if (this.allOrdersManagerFilter) {
            result = result.filter(order => String(order.manager || "").trim() === this.allOrdersManagerFilter);
        }
        if (!this.allOrdersShowCompleted) {
            result = result.filter(order => String(order.stage || "").trim() !== "Завершен");
        }
        if (this.allOrdersSectionFilter) {
            const sectionStages = new Set(this.getAllOrdersSectionStages(this.allOrdersSectionFilter));
            result = result.filter(order => sectionStages.has(String(order.stage || "").trim()));
        }
        result.sort((left, right) => {
            const leftDeadline = this.getDeadlineSortValue(left.deadline);
            const rightDeadline = this.getDeadlineSortValue(right.deadline);
            if (leftDeadline === null && rightDeadline !== null) return -1;
            if (leftDeadline !== null && rightDeadline === null) return 1;
            return (leftDeadline || 0) - (rightDeadline || 0) || Number(left.queue || 0) - Number(right.queue || 0);
        });
    } else if (role === "claims") {
        result = result.filter(order => String(order.stage || "").trim() === "Рекламация");
        result.sort((left, right) => {
            const leftDeadline = this.getDeadlineSortValue(left.deadline);
            const rightDeadline = this.getDeadlineSortValue(right.deadline);
            if (leftDeadline === null && rightDeadline !== null) return -1;
            if (leftDeadline !== null && rightDeadline === null) return 1;
            return (leftDeadline || 0) - (rightDeadline || 0) ||
                String(left.contract || "").localeCompare(String(right.contract || ""), "ru", { numeric: true, sensitivity: "base" });
        });
    } else if (role === "master") {
        result.sort((left, right) => {
            const leftDeadline = this.getDeadlineSortValue(left.deadline);
            const rightDeadline = this.getDeadlineSortValue(right.deadline);
            if (leftDeadline === null && rightDeadline !== null) return -1;
            if (leftDeadline !== null && rightDeadline === null) return 1;
            return (leftDeadline || 0) - (rightDeadline || 0) ||
                String(left.contract || "").localeCompare(String(right.contract || ""), "ru", { numeric: true, sensitivity: "base" }) ||
                String(left.product || "").localeCompare(String(right.product || ""), "ru", { sensitivity: "base" });
        });
    } else if (role === "productionAll") {
        const activeStages = new Set([
            "Распил", "Распил ЛДСП", "Распил МДФ", "Распил Шпон", "Кромка", "Кромка Шпон",
            "Присадка", "Присадка Шпон", "Фрезеровка", "Подготовка", "Сборка", "В покраску",
            "Упаковка Корпуса", "Упаковка Фасада", "СГП Корпуса", "СГП Фасада"
        ]);
        const facadeExitedPaintingKeys = new Set(result
            .filter(order => ["facade-packaging", "facade-packaging-mdf", "facade-packaging-veneer"].includes(String(order.taskType || "")) && String(order.stage || "").trim())
            .map(order => order.key));
        result = result.filter(order => {
            const stage = String(order.stage || "").trim();
            const isStaleMdfPaintingBranch = ["mdf", "veneer"].includes(order.taskType) && stage === "В покраску" && facadeExitedPaintingKeys.has(order.key);
            return activeStages.has(stage) && !isStaleMdfPaintingBranch;
        });
        const seen = new Set();
        result = result.filter(order => {
            const rowKey = `${order.key}|${order.taskType || order.stage || "operation"}`;
            if (seen.has(rowKey)) return false;
            seen.add(rowKey);
            return true;
        });
        result.sort((left, right) => {
            if (this.productionAllSort === "client") {
                return String(left.client || "").localeCompare(String(right.client || ""), "ru", { sensitivity: "base" }) ||
                    String(left.contract || "").localeCompare(String(right.contract || ""), "ru", { numeric: true, sensitivity: "base" });
            }
            if (this.productionAllSort === "contract") {
                return String(left.contract || "").localeCompare(String(right.contract || ""), "ru", { numeric: true, sensitivity: "base" }) ||
                    String(left.client || "").localeCompare(String(right.client || ""), "ru", { sensitivity: "base" });
            }
            const leftDeadline = this.getDeadlineSortValue(left.deadline);
            const rightDeadline = this.getDeadlineSortValue(right.deadline);
            if (leftDeadline === null && rightDeadline !== null) return -1;
            if (leftDeadline !== null && rightDeadline === null) return 1;
            return (leftDeadline || 0) - (rightDeadline || 0) || Number(left.productionQueue || 0) - Number(right.productionQueue || 0);
        });
    } else if (role === "installationAll") {
        result = result.filter(order => Boolean(order.installationOverview));
        result.sort((left, right) => {
            if (Boolean(left.installationComplete) !== Boolean(right.installationComplete)) {
                return left.installationComplete ? 1 : -1;
            }
            const leftDeadline = this.getDeadlineSortValue(left.deadline);
            const rightDeadline = this.getDeadlineSortValue(right.deadline);
            if (leftDeadline === null && rightDeadline !== null) return -1;
            if (leftDeadline !== null && rightDeadline === null) return 1;
            return (leftDeadline || 0) - (rightDeadline || 0);
        });
        if (!this.installationOverviewShowCompleted) {
            result = result.filter(order => !order.installationComplete);
        }
    } else if (this.isManufacturingRole(role)) {
        const stages = new Set(this.getManufacturingStages(role));
        result = result.filter(order => stages.has(String(order.stage || "").trim()));
        if (role === "installation") {
            result = result.filter(order => Boolean(order.installationStream) &&
                String(order.status || "").trim().toLowerCase() !== "готово");
        } else if (role === "delivered") {
            result = result.filter(order => Boolean(order.installationStream) && (
                String(order.stage || "").trim() === "Завершен" ||
                (String(order.stage || "").trim() === "Монтаж" &&
                    String(order.status || "").trim().toLowerCase() === "готово")
            ));
        }
        const seen = new Set();
        result = result.filter(order => {
            const rowKey = ["sawing", "edging", "cnc", "packaging", "delivery", "installation", "delivered"].includes(role)
                ? `${order.key}|${order.taskType || order.stage || "operation"}`
                : order.key;
            if (seen.has(rowKey)) return false;
            seen.add(rowKey);
            return true;
        });
        result.sort((left, right) => {
            const leftDeadline = this.getDeadlineSortValue(left.deadline);
            const rightDeadline = this.getDeadlineSortValue(right.deadline);
            if (leftDeadline === null && rightDeadline !== null) return -1;
            if (leftDeadline !== null && rightDeadline === null) return 1;
            if (leftDeadline !== null && rightDeadline !== null && leftDeadline !== rightDeadline) {
                return leftDeadline - rightDeadline;
            }
            return Number(left.productionQueue || 0) - Number(right.productionQueue || 0) ||
                Number(left.queue || 0) - Number(right.queue || 0);
        });
    } else {
        result = result.filter(order => String(order.stage || "").trim() === (role === "processing" ? "В покраску" : "Технолог"));
        const seen = new Set();
        result = result.filter(order => {
            if (seen.has(order.key)) return false;
            seen.add(order.key);
            return true;
        });
        if (role === "processing") {
            result.sort((left, right) => Number(left.productionQueue || 0) - Number(right.productionQueue || 0));
        } else if (role === "technologist") {
            // Технолог согласует комплект изделий клиента целиком: группируем
            // его заказы рядом, а внутри группы — по наименованию изделия.
            result.sort((left, right) => {
                const byClient = String(left.client || "").localeCompare(
                    String(right.client || ""), "ru", { sensitivity: "base" }
                );
                if (byClient !== 0) return byClient;
                return String(left.product || "").localeCompare(
                    String(right.product || ""), "ru", { sensitivity: "base" }
                );
            });
        }
    }


    if (!skipProductionFilters && this.getManufacturingRoles().some(item => item.role === role)) {
        const availableTypes = new Set(result.flatMap(order => this.getProductionFilterTypes(order, role)));
        const availableClients = new Set(result.map(order => String(order.client || "").trim()).filter(Boolean));
        if (this.masterProductTypeFilter && !availableTypes.has(this.masterProductTypeFilter)) this.masterProductTypeFilter = "";
        if (this.masterClientFilter && !availableClients.has(this.masterClientFilter)) this.masterClientFilter = "";
        if (this.masterProductTypeFilter) result = result.filter(order => this.getProductionFilterTypes(order, role).includes(this.masterProductTypeFilter));
        if (this.masterClientFilter) result = result.filter(order => String(order.client || "").trim() === this.masterClientFilter);
        if (role === "master" && this.masterStageFilter) result = result.filter(order => this.matchesMasterStage(order, this.masterStageFilter));
    }
    return result;

}
        static getRouteStageClass(stage) {
            const value = String(stage || "").trim();
            const production = new Set([
                "Очередь", "Запуск", "Распил", "Распил ЛДСП", "Распил МДФ", "Распил Шпон",
                "Кромка", "Кромка Шпон", "ЧПУ", "Присадка", "Присадка Шпон",
                "Фрезеровка", "Подготовка", "Сборка", "Упаковка", "Упаковка Корпуса", "Упаковка Фасада"
            ]);
            const painting = new Set([
                "В покраску", "Грунт 1 слой", "Шлифовка 1 слой",
                "Грунт 2 слой", "Шлифовка 2 слой", "Покраска тыльной стороны",
                "Обклейка", "Покраска лицевой стороны", "Шлифовка перед лаком",
                "Лак", "Полировка"
            ]);
            if (production.has(value)) return "stage-route-production";
            if (painting.has(value)) return "stage-route-painting";

            if (["Монтаж", "Завершен"].includes(value)) return "stage-route-installation";
            if (value === "Рекламация") return "stage-route-claims";
            return "";
        }

static renderInstallationOverview(orders, container) {
    const allOrders = this.orders.filter(order => Boolean(order.installationOverview));
    const completed = allOrders.filter(order => Boolean(order.installationComplete)).length;
    const pending = allOrders.length - completed;
    const filterLabel = this.installationOverviewShowCompleted ? "Скрыть завершённые" : "Показать завершённые";
    const renderStatus = status => {
        const className = status === "Готово"
            ? "installation-overview-ready"
            : status === "—" ? "installation-overview-not-arrived" : "installation-overview-pending";
        return `<span class="installation-overview-status ${className}">${this.escapeHtml(status)}</span>`;
    };
    const renderCorpusStatus = order => order.corpusInstallationStatus === "—"
        ? `<button class="installation-overview-restore" type="button" data-restore-corpus data-key="${this.escapeHtml(order.orderKey || order.key)}" data-name="${this.escapeHtml(order.displayName || order.product || "изделие")}">Занести корпус</button>`
        : renderStatus(order.corpusInstallationStatus || "—");

    container.innerHTML = `
        <div class="block">
            <div class="block-header">
                <div class="block-name">📋 Все монтажи <span class="badge">${orders.length}</span></div>
                <div class="stage-summary">
                    <button class="queue-sort-btn" type="button" data-installation-overview-filter>${filterLabel}</button>
                    <span class="stage-summary-item">Не завершены <span class="badge">${pending}</span></span>
                    <span class="stage-summary-item">Полностью завершены <span class="badge">${completed}</span></span>
                </div>
            </div>
            <div class="table-wrap">
                <table class="queue-table installation-overview-table">
                    <thead><tr>
                        <th>#</th><th class="order-date-column">Дедлайн</th><th>Договор</th><th>Клиент</th><th>Изделие</th><th>Корпус</th><th>Корпус МДФ</th><th>Крашеный ЛДСП</th><th>Фасад МДФ</th><th>Фасад Шпон</th><th>Действия</th>
                    </tr></thead>
                    <tbody>
                        ${orders.length ? orders.map((order, index) => `<tr class="${order.installationComplete ? "" : "installation-overview-incomplete"}">
                            <td>${index + 1}</td>
                            <td class="order-date-column"><strong>${this.escapeHtml(this.formatDeadline(order.deadline))}</strong></td>
                            <td>${this.escapeHtml(order.contract || "")}</td>
                            <td>${this.escapeHtml(order.client || "")}</td>
                            <td><button class="order-folder-link" data-order-files data-key="${this.escapeHtml(order.orderKey || order.key)}">${this.escapeHtml(order.product || "")}</button></td>
                            <td>${renderCorpusStatus(order)}</td>
                            <td>${renderStatus(order.corpusMdfInstallationStatus || "—")}</td>
                            <td>${renderStatus(order.paintedLdspInstallationStatus || "—")}</td>
                            <td>${renderStatus(order.mdfInstallationStatus || order.facadeInstallationStatus || "—")}</td>
                            <td>${renderStatus(order.veneerInstallationStatus || "—")}</td>
                            <td>${order.installationComplete ? `<span class="installation-overview-ready">Все ветки завершены</span>` : `<span class="installation-overview-pending">Перевод веток — в «Монтаж» и «Сданы»</span>`}</td>
                        </tr>`).join("") : `<tr><td colspan="11" class="installation-overview-empty">Нет незавершённых монтажей</td></tr>`}
                    </tbody>
                </table>
            </div>
        </div>`;
    container.querySelector("[data-installation-overview-filter]")?.addEventListener("click", () => {
        this.installationOverviewShowCompleted = !this.installationOverviewShowCompleted;
        this.render();
    });
    container.querySelectorAll("[data-restore-corpus]").forEach(button => {
        button.addEventListener("click", () => this.restoreCompletedCorpusInstallation(button));
    });
}

static restoreCompletedCorpusInstallation(button) {
    const key = button.dataset.key;
    const name = button.dataset.name || "изделие";
    if (!window.confirm(`Занести корпус «${name}» в монтаж?\n\nБудет создана корпусная ветка «Монтаж» со статусом «Готово». Затем её можно штатно перевести в «Завершен». Фасадные ветки не изменятся.`)) return;
    button.disabled = true;
    QueueController.restoreCompletedCorpusInstallation(key)
        .then(() => this.showSuccessMessage("Корпус добавлен в «Сданы» как «Монтаж / Готово»."))
        .catch(error => this.showMessage(error))
        .finally(() => { button.disabled = false; });
}

static sendInstallationBranchToClaims(button) {
    const key = button.dataset.key;
    const branch = button.dataset.taskType || "";
    this.pauseTarget = { key, taskType: branch, type: "claim-transfer" };
    this.openPauseComment(key, branch);
}

                        return `<tr>
                        <td>${index + 1}</td>

                        <td>${this.escapeHtml(order.contract || "")}</td>

                    </tr>${claimComment ? `<tr class="pause-comment-row"><td colspan="12"><div class="pause-comment"><span class="pause-comment-text"><strong>Комментарий рекламации:</strong> ${this.escapeHtml(claimComment)}</span><button class="pause-comment-edit" type="button" data-claim-comment data-key="${this.escapeHtml(order.key)}">Изменить</button></div></td></tr>` : ""}`;
                    }).join("") : `<tr><td colspan="12" class="installation-overview-empty">Нет изделий в рекламации</td></tr>`}</tbody>
                </table>
            </div>
        </div>`;
    container.querySelectorAll("[data-complete-claim]").forEach(button => {
        button.addEventListener("click", () => this.completeClaim(button));
    });
    container.querySelectorAll("[data-order-files]").forEach(button => {
        button.addEventListener("click", () => this.openOrderFiles(button.dataset.key));
    });
    container.querySelectorAll("[data-claim-comment]").forEach(button => {

    });
}

static completeClaim(button) {
    const key = button.dataset.key;
    const name = button.dataset.name || "изделие";
    if (!window.confirm(`Завершить рекламацию «${name}»? Изделие получит статус «Готово».`)) return;
    button.disabled = true;
    QueueController.completeClaim(key)
        .then(() => this.showSuccessMessage("Рекламация завершена: изделие готово."))
        .catch(error => this.showMessage(error))
        .finally(() => { button.disabled = false; });

static renderManufacturingStageSelect(order) {
    const branch = String(order.taskType || "").toLowerCase();
    const byBranch = {
        ldsp: ["Распил ЛДСП", "Кромка", "Присадка", "Сборка", "Упаковка Корпуса", "СГП Корпуса", "Монтаж", "Завершен"],
        "corpus-mdf": ["Распил МДФ", "Фрезеровка", "Подготовка", "Сборка", "Упаковка Корпуса", "СГП Корпуса", "Монтаж", "Завершен"],
        "painted-ldsp": ["Распил ЛДСП", "Кромка", "Присадка", "В покраску", "Сборка", "Упаковка Корпуса", "СГП Корпуса", "Монтаж", "Завершен"],
        mdf: ["Распил МДФ", "Фрезеровка", "Подготовка"],
        veneer: ["Распил Шпон", "Кромка Шпон", "Присадка Шпон", "Подготовка"],
        "preparation-mdf": ["Подготовка"],
        "preparation-veneer": ["Подготовка"],
        "preparation-corpus-mdf": ["Подготовка"],
        "preparation-legacy": ["Подготовка"],
        "facade-packaging": ["Упаковка Фасада", "СГП Фасада", "Монтаж", "Завершен"],
        "facade-packaging-mdf": ["Упаковка Фасада", "СГП Фасада", "Монтаж", "Завершен"],
        "facade-packaging-veneer": ["Упаковка Фасада", "СГП Фасада", "Монтаж", "Завершен"],
        "legacy-installation": ["Монтаж", "Завершен"]
    };
    const current = String(order.stage || "").trim();
    const configuredStages = byBranch[branch] || (current === "Очередь" ? ["Очередь", "Запуск"] : ["Запуск", "Распил"]);
    // Старый поток мог дойти до монтажа до появления раздельной упаковки.
    // Сохраняем его фактический этап, чтобы селект не подменял его первым пунктом.
    const stages = current && !configuredStages.includes(current)
        ? configuredStages.concat([current])
        : configuredStages;
    const options = stages.map(stage =>
        `<option value="${this.escapeHtml(stage)}" ${stage === current ? "selected" : ""}>${this.escapeHtml(stage)}</option>`
    ).join("");
    const selectedBranch = Object.prototype.hasOwnProperty.call(byBranch, branch) ? branch : "";
    return `<select class="manufacturing-stage-select ${this.getRouteStageClass(current)}" data-manufacturing-stage data-key="${this.escapeHtml(order.key)}" data-branch="${this.escapeHtml(selectedBranch)}" data-previous-value="${this.escapeHtml(current)}">${options}</select>`;
}

static renderOverallStageSelect(order) {
    const stages = ["Запуск", "Распил", "Кромка", "ЧПУ", "Подготовка", "Сборка", "В покраску", "Упаковка", "СГП", "Монтаж", "Рекламация", "Завершен"];
    const current = String(order.stage || "").trim();
    if (!stages.includes(current)) {
        return `<span class="stage ${this.getStageClass(current)}">${this.escapeHtml(current)}</span>`;
    }
    const options = stages.map(stage =>
        `<option value="${this.escapeHtml(stage)}" ${stage === current ? "selected" : ""}>${this.escapeHtml(stage)}</option>`
    ).join("");
    return `<select class="manufacturing-stage-select ${this.getRouteStageClass(current)}" data-overall-stage data-key="${this.escapeHtml(order.key)}" data-previous-value="${this.escapeHtml(current)}">${options}</select>`;

static matchesMasterStage(order, role) {

static exportAllOrdersExcel(button) {
    if (Store.getRole() !== "allOrders") return;
    const orders = this.getFilteredOrders();
    if (!orders.length) {
        this.showMessage(new Error("По текущим фильтрам нет строк для выгрузки."));
        return;
    }

    const sectionLabels = {
        constructors: "Конструкторы",
        production: "Производство",
        painting: "Малярка",
        installation: "Монтажи",
        claims: "Рекламации",
        completed: "Завершённые"
    };
    const filters = [
        this.allOrdersClientFilter ? `Клиент: ${this.allOrdersClientFilter}` : "Все клиенты",
        this.allOrdersManagerFilter ? `Менеджер: ${this.allOrdersManagerFilter}` : "Все менеджеры",
        sectionLabels[this.allOrdersSectionFilter] || "Все этапы",
        this.allOrdersShowCompleted ? "Завершённые включены" : "Без завершённых"
    ].join(" · ");
    const rows = orders.map((order, index) => ({
        number: index + 1,
        deadline: this.formatDeadline(order.deadline),
        proformaApproved: this.formatDeadline(order.proformaApprovedDate),
        plannedReadiness: this.formatDeadline(order.plannedReadinessDate),
        contract: String(order.contract || ""),
        client: String(order.client || ""),
        manager: String(order.manager || "—"),
        product: String(order.product || ""),
        stage: String(order.stage || "")
    }));
    const originalText = button.textContent;
    button.disabled = true;
    button.textContent = "Готовим Excel…";
    QueueController.exportAllOrdersExcel(rows, filters).then(file => {
        if (!file || !file.base64 || !file.filename) throw new Error("Сервер не вернул файл Excel.");
        const binary = atob(file.base64);
        const bytes = new Uint8Array(binary.length);
        for (let index = 0; index < binary.length; index++) bytes[index] = binary.charCodeAt(index);
        const url = URL.createObjectURL(new Blob([bytes], { type: file.mimeType || "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" }));
        const link = document.createElement("a");
        link.href = url;
        link.download = file.filename;
        document.body.appendChild(link);
        link.click();
        link.remove();
        setTimeout(() => URL.revokeObjectURL(url), 0);
    }).catch(error => this.showMessage(error)).finally(() => {
        button.disabled = false;
        button.textContent = originalText;
    });
}

static exportProductionExcel(button) {
    const role = Store.getRole();
    if (!this.getManufacturingRoles().some(item => item.role === role)) return;
    const orders = this.getFilteredOrders();
    if (!orders.length) {
        this.showMessage(new Error("В текущем производственном списке нет строк для выгрузки."));
        return;
    }

    const areaValue = order => {
        const flow = this.getProductFlow(order, role);
        if (flow === "Корпус" || flow === "Крашеный ЛДСП") return Number(order.ldspArea || 0) + Number(order.lhdfArea || 0);
        if (flow === "Фасад МДФ" || flow === "Корпус МДФ") return Number(order.mdfArea || 0);
        if (flow === "Фасад Шпон") return Number(order.veneerArea || 0);
        return null;
    };
    const stageLabel = this.getManufacturingStage(role);
    const rows = orders.map((order, index) => {
        if (role === "master") {
            return {
                number: index + 1,
                deadline: this.formatDeadline(order.deadline),
                orderMeta: [String(order.contract || "").trim(), String(order.client || "").trim()].filter(Boolean).join("\n"),
                product: this.getMasterProductExportLabel(order),
                supplySignals: order.supplySignals || {},
                corpus: this.getMasterFlowText(order, "Корпус"),
                corpusMdf: this.getMasterFlowText(order, "Корпус МДФ"),
                paintedLdsp: this.getMasterFlowText(order, "Крашеный ЛДСП"),
                mdf: this.getMasterFlowText(order, "Фасад МДФ"),
                veneer: this.getMasterFlowText(order, "Фасад Шпон")
            };
        }
        const area = areaValue(order);
        return {
            number: index + 1,
            deadline: this.formatDeadline(order.deadline),
            orderMeta: [String(order.contract || "").trim(), String(order.client || "").trim()].filter(Boolean).join("\n"),
            product: String(order.product || ""),
            productType: this.getProductFlow(order, role) || "—",
            area: area === null ? "—" : `${Number(area).toLocaleString("ru-RU", { maximumFractionDigits: 2 })} м²`,
            stage: String(order.stage || ""),
            status: String(order.status || "—"),
            constructor: String(order.constructor || "—")
        };
    });
    const filters = [
        `Вкладка: ${stageLabel}`,
        role === "master" ? `Этап: ${this.getManufacturingStage(this.masterStageFilter) || "Все этапы"}` : "",
        `Тип изделия: ${this.masterProductTypeFilter || "Все типы"} · Клиент: ${this.masterClientFilter || "Все клиенты"}`,
        role === "productionAll" ? `Сортировка: ${{ deadline: "Дедлайн", client: "Клиент", contract: "Договор" }[this.productionAllSort] || "Дедлайн"}` : ""
    ].filter(Boolean).join(" · ");
    const originalText = button.textContent;
    button.disabled = true;
    button.textContent = "Готовим Excel…";
    QueueController.exportProductionExcel(rows, filters, role === "master" ? "masterMatrix" : role === "launch" ? "productionLaunch" : "productionFlow").then(file => {
        if (!file || !file.base64 || !file.filename) throw new Error("Сервер не вернул файл Excel.");
        const binary = atob(file.base64);
        const bytes = new Uint8Array(binary.length);
        for (let index = 0; index < binary.length; index++) bytes[index] = binary.charCodeAt(index);
        const url = URL.createObjectURL(new Blob([bytes], { type: file.mimeType || "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" }));
        const link = document.createElement("a");
        link.href = url;
        link.download = file.filename;
        document.body.appendChild(link);
        link.click();
        link.remove();
        setTimeout(() => URL.revokeObjectURL(url), 0);
    }).catch(error => this.showMessage(error)).finally(() => {
        button.disabled = false;
        button.textContent = originalText;
    });
}

static downloadExcelFile(file) {
    if (!file || !file.base64 || !file.filename) throw new Error("Сервер не вернул файл Excel.");
    const binary = atob(file.base64);
    const bytes = new Uint8Array(binary.length);
    for (let index = 0; index < binary.length; index++) bytes[index] = binary.charCodeAt(index);
    const url = URL.createObjectURL(new Blob([bytes], { type: file.mimeType || "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" }));
    const link = document.createElement("a");
    link.href = url;
    link.download = file.filename;
    document.body.appendChild(link);
    link.click();
    link.remove();
    setTimeout(() => URL.revokeObjectURL(url), 0);
}

    };

static exportCurrentListExcel(button) {
    const role = Store.getRole();
    const request = (exportType, rows) => {
        if (!rows.length) {
            this.showMessage(new Error("По текущим фильтрам нет строк для выгрузки."));
            return;
        }
        const originalText = button.textContent;
        button.disabled = true;
        button.textContent = "Готовим Excel…";
        QueueController.exportListExcel(exportType, rows, this.getCurrentListExcelFilters(role))
            .then(file => this.downloadExcelFile(file))
            .catch(error => this.showMessage(error))
            .finally(() => { button.disabled = false; button.textContent = originalText; });
    };
    const value = item => String(item || "—");
    const baseRow = (order, index) => ({
        number: index + 1,
        deadline: this.formatDeadline(order.deadline),
        contract: value(order.contract),
        client: value(order.client),
        product: value(order.product)
    });

    if (role === "purchase") {
        return request("supply", SupplyView.getFilteredItems(this.orders).map((item, index) => ({
            ...baseRow(item, index), article: value(item.article), name: value(item.name), quantity: value(item.quantity),
            unit: value(item.unit), purchase: Number(item.purchaseQuantity) > 0 && item.purchaseUnit ? `${item.purchaseQuantity} · ${item.purchaseUnit}` : "—",
            supplier: value(item.supplier), price: item.price === "" || item.price == null ? "—" : Number(item.price).toLocaleString("ru-RU", { maximumFractionDigits: 2 }), status: value(item.purchaseStatus)
        })));
    }
    if (role === "plate") {
        return request("plate", PlateMaterialView.getFilteredItems(this.orders).map((item, index) => ({
            ...baseRow(item, index), category: value(item.category), article: value(item.article), name: value(item.name),
            decor: value(item.decor), thickness: value(item.thickness), sheetSize: value(item.sheetSize),
            purchase: value(item.orderSheets), status: value(item.purchaseStatus)
        })));
    }
    if (role === "supplierOrders") {
        return request("supplierOrders", SupplierOrdersView.getFilteredItems(this.orders).map((item, index) => ({
            number: index + 1, orderNumber: value(item.number), createdAt: this.formatDeadline(item.createdAt),
            supplier: value(item.supplier), status: value(item.status), invoices: value(item.invoiceNumbers), deliveryDate: value(item.deliveryDate ? item.deliveryDate.split("-").reverse().join(".") : ""),
            products: (item.products || []).join(", ") || "—", positions: value(item.lineCount),
            total: Number(item.total || 0).toLocaleString("ru-RU", { maximumFractionDigits: 2 })
        })));
    }
    if (role === "equipment") return request("equipment", EquipmentView.getFilteredItems().map(item => ({
        contract: value(item.contract), client: value(item.client), name: value(item.name), model: value(item.model),
        manager: value(item.manager), supplier: value(item.supplier), status: value(item.status)
    })));
    if (role === "equipmentInvoices") return request("equipmentInvoices", EquipmentInvoicesView.filtered().map(item => ({
        number: value(item.number), date: value(item.date), supplier: value(item.supplier),
        amount: Number(item.amount || 0).toLocaleString("ru-RU", { maximumFractionDigits: 2 }), status: value(item.paymentStatus),
        lines: (item.lines || []).map(line => [line.contract, line.name, line.model].filter(Boolean).join(" · ")).join("; ") || "—"
    })));
    if (role === "tabletops") return request("tabletops", TabletopView.getFilteredItems().map(item => ({
        contract: value(item.contract), client: value(item.client), name: value(item.name), manager: value(item.manager),
        supplier: value(item.supplier), status: value(item.status)
    })));

    const orders = this.getFilteredOrders();
    if (role === "claims") return request("claims", orders.map((order, index) => {
        const overview = order.claimOverview || {};
        return { ...baseRow(order, index), corpus: value(overview.corpus), corpusMdf: value(overview.corpusMdf), paintedLdsp: value(overview.paintedLdsp), mdf: value(overview.mdf), veneer: value(overview.veneer), comment: value(order.claimComment) };
    }));
    if (role === "installationAll") return request("installationAll", orders.map((order, index) => ({
        ...baseRow(order, index), corpus: value(order.corpusInstallationStatus), corpusMdf: value(order.corpusMdfInstallationStatus),
        paintedLdsp: value(order.paintedLdspInstallationStatus), mdf: value(order.mdfInstallationStatus || order.facadeInstallationStatus), veneer: value(order.veneerInstallationStatus)
    })));

    const paintingRoles = ["paintingAll", "processing", "sanding", "painting", "armSanding", "armPainting"];
    const exportType = role === "constructor" ? "constructor" : paintingRoles.includes(role) ? "painting" : "installation";
    return request(exportType, orders.map((order, index) => ({
        ...baseRow(order, index), productType: this.getProductFlow(order, role) || "—", stage: value(order.stage), status: value(order.status),
        responsible: value(order.constructor || order.painter || order.sandingWorker || order.manager)
    })));
}

static getProductFlow(order, role) {
    if (role === "master") return "";
    const stage = String(order.stage || "").replace(/ \(резерв\)$/, "").trim();
    const taskType = String(order.taskType || "").trim().toLowerCase();
    if (role === "launch" || stage === "Запуск") return "";
    if (["paintingAll", "processing", "sanding", "painting", "armSanding", "armPainting"].includes(role)) {
        const branch = String(order.paintingBranch || "").toLowerCase();
        return branch === "veneer" ? "Фасад Шпон" : branch === "corpus-mdf" ? "Корпус МДФ" : branch === "painted-ldsp" ? "Крашеный ЛДСП" : "Фасад МДФ";
    }
    if (taskType === "preparation-veneer" || taskType === "veneer" || stage.includes("Шпон")) return "Фасад Шпон";
    if (taskType === "preparation-corpus-mdf" || taskType === "corpus-mdf") return "Корпус МДФ";
    if (taskType === "painted-ldsp") return "Крашеный ЛДСП";
    if (taskType === "preparation-mdf" || taskType === "preparation-legacy" || taskType === "mdf" || taskType === "facade-packaging" || taskType === "facade-packaging-mdf" || stage === "В покраску" || stage.includes("Фасада")) return "Фасад МДФ";
    if (taskType === "ldsp" || ["Распил ЛДСП", "Кромка", "Присадка", "Сборка"].includes(stage) || stage.includes("Корпуса")) return "Корпус";
    return "";
}

static getMasterFlow(order, type) {

    return order[fields[type]] || null;
}

static renderProformaApprovedDate(order) {
    const formatted = this.formatDisplayDate(order.proformaApprovedDate);
    if (formatted) return `<strong>${this.escapeHtml(formatted)}</strong>`;
    const blockedStages = new Set(["ТЗ", "Технолог", "Проформа", "Согласование", "Правки", "КД"]);
    const stage = String(order.stage || "").trim();
    if (!stage || blockedStages.has(stage)) return "—";
    return `<input class="status-select" type="date" data-proforma-approved-date data-key="${this.escapeHtml(order.key)}" aria-label="Проформа согласована">`;

static saveProformaApprovedDate(input) {
    if (!input.value) return;
    input.disabled = true;
    QueueController.setProformaApprovedDate(input.dataset.key, input.value)
        .catch(error => {
            input.disabled = false;
            input.value = "";

        });
}

static changeManufacturingStage(select) {
    const previousValue = select.dataset.previousValue || "";
    select.disabled = true;
    QueueController.changeManufacturingStage(select.dataset.key, select.dataset.branch || "", select.value)
        .catch(error => {
            select.value = previousValue;
            this.showMessage(error);
        })
        .finally(() => { select.disabled = false; });
}

static changeOverallStage(select) {
    const previousValue = select.dataset.previousValue || "";
    const targetStage = select.value;
    if (targetStage === previousValue) return;
    const order = this.orders.find(item => String(item.key) === String(select.dataset.key));
    const orderName = order
        ? [order.contract, order.client, order.product].map(value => String(value || "").trim()).filter(Boolean).join(" • ")
        : "выбранное изделие";
    const branches = ["Корпус"];
    if (order && order.hasMdfFacade) branches.push("Фасад МДФ");
    if (order && order.hasVeneerFacade) branches.push("Фасад Шпон");
    const confirmed = window.confirm(
        `Перевести всё изделие с этапа «${previousValue}» на этап «${targetStage}»?\n\n${orderName}\n\nВетки: ${branches.join(", ")}\n\nТекущие операции и статусы этих веток будут заменены состоянием нового этапа.`
    );
    if (!confirmed) {
        select.value = previousValue;
        return;
    }
    select.disabled = true;
    QueueController.moveOrderToOverallStage(select.dataset.key, targetStage)
        .catch(error => {
            select.value = previousValue;
            this.showMessage(error);
        })
        .finally(() => { select.disabled = false; });
}

static changeFacadeType(select) {
    const key = select.dataset.key;
    const previousValue = select.dataset.previousValue || "";
    const nextValue = select.value;
    const relatedSelects = Array.from(document.querySelectorAll("[data-facade-type]"))
        .filter(item => item.dataset.key === key);
    relatedSelects.forEach(item => { item.disabled = true; });
    QueueController.changeFacadeType(key, nextValue)
        .then(result => {
            const savedValue = result && typeof result.facadeType === "string" ? result.facadeType : nextValue;
            this.orders.filter(item => item.key === key).forEach(order => { order.facadeType = savedValue; });
            relatedSelects.forEach(item => {
                item.dataset.previousValue = savedValue;
                item.value = savedValue;
            });
            if (Store.state.paintingNorms && Store.state.paintingNorms.hourlyEnabled) {
                return QueueController.load();
            }
        })
        .catch(error => {
            relatedSelects.forEach(item => { item.value = previousValue; });
            this.showMessage(error);
        })
        .finally(() => { relatedSelects.forEach(item => { item.disabled = false; }); });
}

    switch (String(status || "").trim().toLowerCase()) {

}

static getArmPaintingStatus(order) {

static formatDisplayDate(value) {
    if (!value) return "";
    if (typeof value === "string") {
        const match = value.match(/^(\d{2}\.\d{2}\.\d{4})/);
        if (match) return match[1];
    }
    const date = new Date(value);
    return Number.isNaN(date.getTime())
        ? String(value)
        : date.toLocaleDateString("ru-RU");
}

static formatDeadline(value) {
    const formatted = this.formatDisplayDate(value);
    return formatted && formatted !== "0" ? formatted : "—";
}

static getDeadlineSortValue(value) {
    if (value === null || value === undefined || value === "" || value === "—") return null;
    if (typeof value === "string") {
        const match = value.trim().match(/^(\d{2})\.(\d{2})\.(\d{4})$/);
        if (match) return Date.UTC(Number(match[3]), Number(match[2]) - 1, Number(match[1]));
    }
    const date = new Date(value);
    return Number.isNaN(date.getTime()) ? null : date.getTime();
}

static getDeadlineUrgencyClass(value) {
    const formatted = this.formatDisplayDate(value);
    const match = String(formatted || "").match(/^(\d{2})\.(\d{2})\.(\d{4})$/);
    if (!match) return "";
    const deadline = Date.UTC(Number(match[3]), Number(match[2]) - 1, Number(match[1]));
    const now = new Date();
    const today = Date.UTC(now.getFullYear(), now.getMonth(), now.getDate());
    const daysLeft = Math.round((deadline - today) / 86400000);
    if (daysLeft < 0) return "deadline-overdue-row";
    if (daysLeft <= 7) return "deadline-soon-row";
    return "";
}

static showMessage(error) {
    const raw = String(error && error.message ? error.message : error || "").trim();
    if (raw.includes("APP_VERSION_MISMATCH")) {
        this.showVersionMismatch(error);
        return;
    }
    const modal = document.getElementById("appMessageModal");
    if (!modal) return;

    let title = "Операция не выполнена";
    let details = "Попробуйте ещё раз. Если ошибка повторится, сообщите администратору.";
    let technical = raw;

    if (raw.includes("У этого конструктора уже есть заказ в работе")) {
        title = "У конструктора уже есть заказ в работе";
        details = "Завершите текущий заказ или поставьте его на паузу, прежде чем начинать следующий.";
    } else if (raw.includes("Укажите причину паузы")) {
        title = "Укажите причину паузы";
        details = "Комментарий поможет понять, что требуется для продолжения работы.";
    } else if (raw.includes("На согласование можно передать только")) {
        title = "Заказ нельзя передать на согласование";
        details = "На согласование передаётся только активная Проформа.";
    } else if (raw.includes("Заказ уже изменился") || raw.includes("Заказ не найден")) {
        title = "Очередь уже изменилась";
        details = "Список обновлён. Проверьте актуальный статус заказа и повторите действие при необходимости.";
    } else if (raw.includes("Выберите дату")) {
        title = "Выберите дату";
        details = "Укажите рабочую дату для ручного приоритета заказа.";
    } else if (raw.includes("Выберите файл")) {
        title = "Выберите файл";
        details = "Сначала выберите один или несколько файлов для загрузки.";
    }

    document.getElementById("appMessageTitle").textContent = title;
    document.getElementById("appMessageDetails").textContent = details;
    const technicalElement = document.getElementById("appMessageTechnical");
    technicalElement.textContent = technical ? "Техническая информация: " + technical : "";
    technicalElement.classList.toggle("hidden", !technical);
    document.getElementById("closeAppMessage").classList.remove("hidden");
    document.getElementById("refreshAppMessage").classList.add("hidden");
    modal.classList.remove("hidden");
}

static showSuccessMessage(details) {
    const modal = document.getElementById("appMessageModal");
    if (!modal) return;
    document.getElementById("appMessageTitle").textContent = "Готово";
    document.getElementById("appMessageDetails").textContent = String(details || "Изменения сохранены.");
    const technicalElement = document.getElementById("appMessageTechnical");
    technicalElement.textContent = "";
    technicalElement.classList.add("hidden");
    document.getElementById("closeAppMessage").classList.remove("hidden");
    document.getElementById("refreshAppMessage").classList.add("hidden");
    modal.classList.remove("hidden");
}

static showVersionMismatch(error) {
    const raw = String(error && error.message ? error.message : error || "").trim();
    const versions = raw.match(/client=([^|]+)\|server=([^|]+)/);
    const modal = document.getElementById("appMessageModal");
    if (!modal) return;
    Store.appVersionOutdated = true;
    document.getElementById("appMessageTitle").textContent = "Приложение обновлено";
    document.getElementById("appMessageDetails").textContent = "Перезапустите приложение, чтобы использовать актуальную версию и избежать ошибок.";
    const technicalElement = document.getElementById("appMessageTechnical");
    technicalElement.textContent = versions
        ? "Версия приложения: " + versions[1] + ". Версия сервера: " + versions[2] + "."
        : "Версия приложения больше не соответствует версии сервера.";
    technicalElement.classList.remove("hidden");
    document.getElementById("closeAppMessage").classList.add("hidden");
    document.getElementById("refreshAppMessage").classList.remove("hidden");
    modal.classList.remove("hidden");
}

static refreshApplication() {
    const appUrl = String(window.APP_URL || "").trim();
    if (!appUrl) {
        window.location.reload();
        return;
    }
    // Web-приложение Apps Script работает во вложенном googleusercontent iframe.
    // Перезагрузка iframe даёт пустую страницу, поэтому открываем URL deployment
    // на верхнем уровне окна из пользовательского клика.
    try {
        window.top.location.href = appUrl;
    } catch (error) {
        window.open(appUrl, "_top");
    }
}

static closeMessage() {
    if (Store.isAppVersionOutdated()) return;
    document.getElementById("appMessageModal").classList.add("hidden");
}

static openOrderFiles(key) {
    const order = this.orders.find(item => item.key === key);
    const modal = document.getElementById("orderFilesModal");
    if (!order || !modal) return;
    this.selectedOrderKey = key;
    this.selectedFileSection = this.getDefaultFileSection(order);
    this.orderFilesBySection = {};
    this.selectedMeasurementFileId = "";
    this.clearMeasurementPreview();
    document.getElementById("orderFilesName").textContent =
        [order.contract, order.client, order.product].filter(Boolean).join(" • ");
    document.getElementById("orderFilesManager").textContent = String(order.manager || "").trim() || "—";
    document.getElementById("orderFilesConstructor").textContent = String(order.constructor || "").trim() || "—";
    this.fillOrderFilesProformaApproval(order);
    this.fillDeadlineSettings(order);
    const mdfFacadeToggle = document.getElementById("orderHasMdfFacade");
    if (mdfFacadeToggle) {
        mdfFacadeToggle.checked = Boolean(order.hasMdfFacade);
        mdfFacadeToggle.dataset.previousValue = String(Boolean(order.hasMdfFacade));
        mdfFacadeToggle.disabled = false;
    }
    const ldspFacadeToggle = document.getElementById("orderHasLdspFacade");
    if (ldspFacadeToggle) ldspFacadeToggle.checked = Boolean(order.hasLdspFacade);
    const veneerFacadeToggle = document.getElementById("orderHasVeneerFacade");
    if (veneerFacadeToggle) {
        veneerFacadeToggle.checked = Boolean(order.hasVeneerFacade);
        veneerFacadeToggle.dataset.previousValue = String(Boolean(order.hasVeneerFacade));
        veneerFacadeToggle.disabled = false;
    }
    const noFacadeToggle = document.getElementById("orderHasNoFacade");
    if (noFacadeToggle) noFacadeToggle.checked = Boolean(order.hasNoFacade);
    this.applyCorpusTypeSelection(order);
    const corpusTypesLaunched = !["Очередь", "Запуск"].includes(String(order.stage || "").trim());
    ["orderHasCorpusLdsp", "orderHasCorpusMdf", "orderHasPaintedLdsp"].forEach(id => {
        const input = document.getElementById(id);
        if (!input) return;
        input.disabled = false;
        if (corpusTypesLaunched && input.checked) input.dataset.lockedAfterLaunch = "true";
        else delete input.dataset.lockedAfterLaunch;
    });
    const materialAreasField = document.getElementById("materialAreasField");
    if (materialAreasField) materialAreasField.classList.toggle("hidden", Store.getSection() !== "production");
    document.getElementById("orderLdspArea").value = order.ldspArea || "";
    document.getElementById("orderMdfArea").value = order.mdfArea || "";
    document.getElementById("orderLhdfArea").value = order.lhdfArea || "";
    document.getElementById("orderVeneerArea").value = order.veneerArea || "";
    this.setFacadeMaterialControlsDisabled(false);
    this.rememberFacadeMaterialSelection();
    this.showFacadeMaterialError(false);
    document.getElementById("orderFilesList").textContent = "Загрузка файлов…";
    document.getElementById("downloadMeasurementsArchive").classList.add("hidden");
    document.getElementById("orderFileInput").value = "";
    this.updateFileSectionUi();
    this.renderSelectedOrderFiles();
    modal.classList.remove("hidden");
    QueueController.getOrderFiles(key)
        .then(filesBySection => {
            this.orderFilesBySection = filesBySection || {};
            this.renderOrderFiles();
        })
        .catch(error => {
            const message = error.message || error;
            document.getElementById("orderFilesList").textContent = message;
        });
}

static fillOrderFilesProformaApproval(order) {
    const approval = document.getElementById("orderFilesProformaApproval");
    const editButton = document.getElementById("editOrderFilesProformaApproval");
    const input = document.getElementById("orderFilesProformaApprovalInput");
    const approvedDate = this.formatDisplayDate(order?.proformaApprovedDate);
    if (approval) {
        approval.textContent = approvedDate ? `Проформа согласована: ${approvedDate}` : "Проформа не согласована";
        approval.classList.remove("hidden");
    }
    if (editButton) editButton.textContent = approvedDate ? "Изменить" : "Указать дату";
    if (input) input.value = this.toDateInputValue(order?.proformaApprovedDate || "");
    this.closeOrderFilesProformaApprovalEditor();
}

static saveOrderFilesProformaApproval() {
    const input = document.getElementById("orderFilesProformaApprovalInput");
    const button = document.getElementById("saveOrderFilesProformaApproval");
    if (!this.selectedOrderKey || !input?.value) {
        this.showMessage("Укажите дату согласования Проформы.");
        return;
    }
    const key = this.selectedOrderKey;
    button.disabled = true;
    QueueController.setProformaApprovedDate(key, input.value)
        .then(() => {
            const updated = this.orders.find(order => order.key === key);
            if (updated && this.selectedOrderKey === key) this.fillOrderFilesProformaApproval(updated);
            if (this.selectedOrderKey === key) this.showMessage("Дата согласования Проформы сохранена.");
        })
        .catch(error => {
            if (this.selectedOrderKey === key) this.showMessage(error);
        })
        .finally(() => { button.disabled = false; });
}

static fillDeadlineSettings(order) {
    const mode = document.getElementById("orderDeadlineMode");
    const days = document.getElementById("orderManufacturingDays");
    const manualDate = document.getElementById("orderManualDeadline");
    if (!mode || !days || !manualDate) return;
    mode.value = order.deadlineMode === "Конкретная дата" ? "Конкретная дата" : "От согласования проформы";
    days.value = Number(order.manufacturingDays) || 50;
    manualDate.value = this.toDateInputValue(order.manualDeadlineDate);
    this.updateDeadlineSettingsUi();
}

static setDeadlineMode(mode) {
    const input = document.getElementById("orderDeadlineMode");
    if (!input) return;
    input.value = mode;
    this.updateDeadlineSettingsUi();
}

static updateDeadlineSettingsUi() {
    const isManual = document.getElementById("orderDeadlineMode")?.value === "Конкретная дата";
    document.getElementById("orderManufacturingDaysField")?.classList.toggle("hidden", isManual);
    document.getElementById("orderManualDeadlineField")?.classList.toggle("hidden", !isManual);
    document.getElementById("orderDeadlineByDays")?.classList.toggle("active", !isManual);
    document.getElementById("orderDeadlineByDate")?.classList.toggle("active", isManual);
    this.updateCalculatedDeadline();
}

static updateCalculatedDeadline() {
    const calculated = document.getElementById("orderCalculatedDeadline");
    if (!calculated) return;
    const isManual = document.getElementById("orderDeadlineMode")?.value === "Конкретная дата";
    if (isManual) {
        const value = document.getElementById("orderManualDeadline")?.value || "";
        calculated.textContent = `Дедлайн: ${value ? this.formatDeadline(value) : "—"}`;
        return;
    }
    const order = this.orders.find(item => item.key === this.selectedOrderKey);
    const days = Number(document.getElementById("orderManufacturingDays")?.value || 0);
    const approved = this.toDateInputValue(order?.proformaApprovedDate || "");
    if (!approved || !Number.isInteger(days) || days <= 0) {
        calculated.textContent = "Дедлайн: —";
        return;
    }
    const [year, month, day] = approved.split("-").map(Number);
    const deadline = new Date(year, month - 1, day + days);
    calculated.textContent = `Дедлайн: ${deadline.toLocaleDateString("ru-RU")}`;
}

static toDateInputValue(value) {
    const formatted = this.formatDisplayDate(value);
    const match = String(formatted || "").match(/^(\d{2})\.(\d{2})\.(\d{4})$/);
    return match ? `${match[3]}-${match[2]}-${match[1]}` : "";
}

static saveOrderDeadlineSettings() {
    const button = document.getElementById("saveOrderDeadlineSettings");
    const mode = document.getElementById("orderDeadlineMode")?.value || "";
    const days = document.getElementById("orderManufacturingDays")?.value || "";
    const manualDate = document.getElementById("orderManualDeadline")?.value || "";
    if (!this.selectedOrderKey) return;
    const key = this.selectedOrderKey;
    button.disabled = true;
    button.textContent = "Сохранение…";
    QueueController.setOrderDeadlineSettings(key, mode, days, manualDate)
        .then(() => {
            const updated = this.orders.find(item => item.key === key);
            if (updated && this.selectedOrderKey === key) this.fillDeadlineSettings(updated);
            if (this.selectedOrderKey === key) this.showMessage("Настройки дедлайна сохранены.");
        })
        .catch(error => {
            if (this.selectedOrderKey === key) this.showMessage(error);
        })
        .finally(() => {
            button.disabled = false;
            button.textContent = "Сохранить дедлайн";
        });
}

static changeMdfFacade(toggle) {
    const previousValue = toggle.dataset.previousValue === "true";
    const nextValue = toggle.checked;
    toggle.disabled = true;
    QueueController.setMdfFacade(this.selectedOrderKey, nextValue)
        .then(result => {
            const savedValue = result && typeof result.hasMdfFacade === "boolean"
                ? result.hasMdfFacade
                : nextValue;
            toggle.checked = savedValue;
            toggle.dataset.previousValue = String(savedValue);
        })
        .catch(error => {
            toggle.checked = previousValue;
            this.showMessage(error);
        })
        .finally(() => { toggle.disabled = false; });
}

static changeVeneerFacade(toggle) {
    const previousValue = toggle.dataset.previousValue === "true";
    const nextValue = toggle.checked;
    toggle.disabled = true;
    QueueController.setVeneerFacade(this.selectedOrderKey, nextValue)
        .then(result => {
            const savedValue = result && typeof result.hasVeneerFacade === "boolean"
                ? result.hasVeneerFacade
                : nextValue;
            toggle.checked = savedValue;
            toggle.dataset.previousValue = String(savedValue);
        })
        .catch(error => {
            toggle.checked = previousValue;
            this.showMessage(error);
        })
        .finally(() => { toggle.disabled = false; });
}

static getFacadeMaterialSelection() {
    return {
        hasLdspFacade: Boolean(document.getElementById("orderHasLdspFacade")?.checked),
        hasMdfFacade: Boolean(document.getElementById("orderHasMdfFacade")?.checked),
        hasVeneerFacade: Boolean(document.getElementById("orderHasVeneerFacade")?.checked),
        hasNoFacade: Boolean(document.getElementById("orderHasNoFacade")?.checked)
    };
}

static applyFacadeMaterialSelection(selection) {
    const values = selection || {};
    document.getElementById("orderHasLdspFacade").checked = Boolean(values.hasLdspFacade);
    document.getElementById("orderHasMdfFacade").checked = Boolean(values.hasMdfFacade);
    document.getElementById("orderHasVeneerFacade").checked = Boolean(values.hasVeneerFacade);
    document.getElementById("orderHasNoFacade").checked = Boolean(values.hasNoFacade);
}

static rememberFacadeMaterialSelection() {
    const field = document.getElementById("facadeMaterialField");
    if (field) field.dataset.previousValue = JSON.stringify(this.getFacadeMaterialSelection());
}

static setFacadeMaterialControlsDisabled(disabled) {
    ["orderHasLdspFacade", "orderHasMdfFacade", "orderHasVeneerFacade", "orderHasNoFacade"].forEach(id => {
        const input = document.getElementById(id);
        if (input) input.disabled = disabled;
    });
}

static getCorpusTypeSelection() {
    return {
        hasCorpusLdsp: Boolean(document.getElementById("orderHasCorpusLdsp")?.checked),
        hasCorpusMdf: Boolean(document.getElementById("orderHasCorpusMdf")?.checked),
        hasPaintedLdsp: Boolean(document.getElementById("orderHasPaintedLdsp")?.checked)
    };
}

static applyCorpusTypeSelection(values) {
    const selection = values || {};
    document.getElementById("orderHasCorpusLdsp").checked = selection.hasCorpusLdsp !== false;
    document.getElementById("orderHasCorpusMdf").checked = Boolean(selection.hasCorpusMdf);
    document.getElementById("orderHasPaintedLdsp").checked = Boolean(selection.hasPaintedLdsp);
}

static setCorpusTypeControlsDisabled(disabled) {
    ["orderHasCorpusLdsp", "orderHasCorpusMdf", "orderHasPaintedLdsp"].forEach(id => {
        const input = document.getElementById(id);
        if (input) input.disabled = disabled;
    });
}

static changeCorpusTypes(changedToggle) {
    const order = this.orders.find(item => item.key === this.selectedOrderKey);
    const previous = {
        hasCorpusLdsp: order?.hasCorpusLdsp !== false,
        hasCorpusMdf: Boolean(order?.hasCorpusMdf),
        hasPaintedLdsp: Boolean(order?.hasPaintedLdsp)
    };
    const launched = !["Очередь", "Запуск"].includes(String(order?.stage || "").trim());
    if (launched && changedToggle.dataset.lockedAfterLaunch === "true" && !changedToggle.checked) {
        changedToggle.checked = true;
        this.showMessage("После запуска ветку корпуса нельзя отменить.");
        return;
    }
    const selection = this.getCorpusTypeSelection();
    this.setCorpusTypeControlsDisabled(true);
    QueueController.setCorpusTypes(this.selectedOrderKey, selection)
        .then(result => {
            this.applyCorpusTypeSelection(result || selection);
            ["orderHasCorpusLdsp", "orderHasCorpusMdf", "orderHasPaintedLdsp"].forEach(id => {
                const input = document.getElementById(id);
                if (!input) return;
                if (launched && input.checked) input.dataset.lockedAfterLaunch = "true";
            });
        })
        .catch(error => {
            this.applyCorpusTypeSelection(previous);
            this.showMessage(error);
        })
        .finally(() => this.setCorpusTypeControlsDisabled(false));
}

static showFacadeMaterialError(show) {
    document.getElementById("facadeMaterialField")?.classList.toggle("invalid", show);
    document.getElementById("facadeMaterialError")?.classList.toggle("hidden", !show);
}

static changeFacadeMaterials(changedToggle) {
    const field = document.getElementById("facadeMaterialField");
    const previous = JSON.parse(field?.dataset.previousValue || "{}");
    if (changedToggle.id === "orderHasNoFacade" && changedToggle.checked) {
        this.applyFacadeMaterialSelection({ hasNoFacade: true });
    } else if (changedToggle.checked) {
        document.getElementById("orderHasNoFacade").checked = false;
    }
    const selection = this.getFacadeMaterialSelection();
    this.setFacadeMaterialControlsDisabled(true);
    QueueController.setFacadeMaterials(this.selectedOrderKey, selection)
        .then(result => {
            this.applyFacadeMaterialSelection(result || selection);
            this.rememberFacadeMaterialSelection();
            this.showFacadeMaterialError(false);
        })
        .catch(error => {
            this.applyFacadeMaterialSelection(previous);
            this.showMessage(error);
        })
        .finally(() => this.setFacadeMaterialControlsDisabled(false));
}

static getMaterialAreas() {
    return {
        ldspArea: document.getElementById("orderLdspArea").value,
        mdfArea: document.getElementById("orderMdfArea").value,
        lhdfArea: document.getElementById("orderLhdfArea").value,

}

static saveMaterialAreas() {

        .map(id => document.getElementById(id));

        })
        .catch(error => this.showMessage(error))
        .finally(() => {
