    static applyActionSnapshot(response) {
        if (!response) {
            throw new Error("Сервер не вернул обновлённую очередь.");
        }
        if (!Store.validateAppVersion(response.appVersion)) {
            throw new Error("APP_VERSION_MISMATCH|client=" + String(window.APP_VERSION || "unknown") + "|server=" + String(response.appVersion || "unknown"));
        }
        if (response.patch) Store.applyActionPatch(response.patch);
        else if (response.snapshot) Store.applyActionSnapshot(response.snapshot);
        else throw new Error("Сервер не вернул обновлённую очередь.");
        return response.result;
    }

    static runQueueAction(request) {
        const startedAt = performance.now();
        return request.then(response => {
            const responseAt = performance.now();
            const result = this.applyActionSnapshot(response);
            console.info("QUEUE_PERF", {
                roundTripMs: Math.round(responseAt - startedAt),
                renderMs: Math.round(performance.now() - responseAt),
                server: response.performance || null
            });
            return result;
        });
    }



    static setRole(role) {
        const previousSection = Store.getSection();

        Store.setRole(role);
        if (Store.getSection() !== previousSection || previousRole !== role) {

        }

}
