<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <title>Orders</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:sans-serif;background:#f0f2f5;color:#333;line-height:1.6}
    .header{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;padding:20px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px}
    .header-left{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
    .header-title{font-size:24px;font-weight:700}
    .filter-buttons{display:flex;gap:10px}
    .filter-btn{background:rgba(255,255,255,.2);border:none;color:#fff;padding:8px 16px;border-radius:20px;cursor:pointer;font-size:14px;transition:all .3s}
    .filter-btn:hover{background:rgba(255,255,255,.35);transform:translateY(-2px)}
    .filter-btn.active{background:#fff;color:#667eea}
    .header-right{display:flex;align-items:center;gap:20px}
    .current-date{font-size:14px;opacity:.9}
    .order-count{background:rgba(255,255,255,.2);padding:6px 14px;border-radius:20px}
    .auto-save{background:rgba(76,175,80,.3);padding:6px 14px;border-radius:20px;font-size:13px;display:flex;align-items:center;gap:6px}
    .app-container{max-width:1400px;margin:0 auto;padding:24px}
    .stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;margin-bottom:24px}
    .stat-card{background:#fff;border-radius:16px;padding:20px;box-shadow:0 2px 12px rgba(0,0,0,.08);transition:transform .3s,box-shadow .3s}
    .stat-card:hover{transform:translateY(-4px);box-shadow:0 8px 24px rgba(0,0,0,.12)}
    .stat-header{display:flex;align-items:center;gap:10px;margin-bottom:16px;font-size:18px;font-weight:600}
    .stat-icon{font-size:24px}
    .stat-badges{display:flex;gap:8px;flex-wrap:wrap}
    .badge{padding:6px 12px;border-radius:12px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px}
    .badge-total{background:#e3f2fd;color:#1976d2}
    .badge-tz{background:#fff3e0;color:#f57c00}
    .badge-proforma{background:#f3e5f5;color:#7b1fa2}
    .badge-kd{background:#e8f5e9;color:#388e3c}
    .table-section{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,.08);margin-bottom:24px}
    .table-header{background:#f8f9fa;padding:16px 20px;border-bottom:2px solid #e9ecef}
    .table-title{font-size:18px;font-weight:600;color:#495057}
    .orders-table{width:100%;border-collapse:collapse}
    .orders-table th{background:#f8f9fa;text-align:left;padding:14px 16px;font-size:13px;font-weight:600;color:#6c757d;text-transform:uppercase;border-bottom:2px solid #dee2e6}
    .orders-table td{padding:16px;border-bottom:1px solid #e9ecef;vertical-align:middle}
    .orders-table tr:last-child td{border-bottom:none}
    .orders-table tr:hover{background:#f8f9fa}
    .order-date{font-weight:600;color:#495057}
    .order-day{font-size:12px;color:#6c757d;margin-top:4px}
    .order-name{font-weight:500;color:#212529}
    .person-name{font-weight:500;color:#495057}
    .stage-cell{min-width:280px}
    .stage-buttons{display:flex;gap:6px;flex-wrap:wrap}
    .stage-btn{padding:6px 12px;border:none;border-radius:8px;font-size:12px;font-weight:500;cursor:pointer;transition:all .2s;white-space:nowrap}
    .stage-btn:hover{transform:scale(1.05)}
    .stage-sergey{background:#e0e0e0;color:#424242}
    .stage-sergey.active{background:#9e9e9e;color:#fff}
    .stage-manager{background:#bbdefb;color:#1565c0}
    .stage-manager.active{background:#1976d2;color:#fff}
    .stage-client{background:#ffe0b2;color:#e65100}
    .stage-client.active{background:#ff9800;color:#fff}
    .stage-constructor{background:#e1bee7;color:#6a1b9a}
    .stage-constructor.active{background:#8e24aa;color:#fff}
    .stage-workshop{background:#c8e6c9;color:#2e7d32}
    .stage-workshop.active{background:#4caf50;color:#fff}
    .order-notes{font-size:13px;color:#6c757d;max-width:200px}
    .notes-block{background:#fff8e1;border-left:4px solid #ffc107;padding:16px 20px;margin-top:16px;border-radius:0 12px 12px 0;display:flex;align-items:flex-start;gap:12px}
    .notes-icon{font-size:20px}
    .notes-text{font-size:14px;color:#5d4037;line-height:1.5}
    .notes-text strong{color:#e65100}
  </style>
</head>
<body>
  <div class="header">
    <div class="header-left">
      <div class="header-title">📋 Сводка заказов</div>
      <div class="filter-buttons">
        <button class="filter-btn" onclick="resetAllStages()">↺ Сбросить все стадии</button>
        <button class="filter-btn active" onclick="filterBy('managers')">👩‍💼 По менеджерам</button>
        <button class="filter-btn" onclick="filterBy('constructors')">🛠️ По конструкторам</button>
      </div>
    </div>
    <div class="header-right">
      <div class="current-date" id="currentDate"></div>
      <div class="order-count">Всего заказов: <strong>19</strong></div>
      <div class="auto-save">💾 Данные сохраняются автоматически</div>
    </div>
  </div>
  
  <script>
    // === ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ ===
    let APP_DATA = [];
    let currentFilter = 'all';

    const STAGES = [
      { id: 'sergey', label: 'У Сергея', class: 'stage-sergey' },
      { id: 'manager', label: 'У менеджера', class: 'stage-manager' },
      { id: 'client', label: 'У клиента', class: 'stage-client' },
      { id: 'designer', label: 'У конструктора', class: 'stage-constructor' },
      { id: 'workshop', label: 'В цеху', class: 'stage-workshop' }
    ];

    // === ИНИЦИАЛИЗАЦИЯ ===
    window.addEventListener('DOMContentLoaded', () => {
      setCurrentDate();
      loadRealData();
    });

    function setCurrentDate() {
      const now = new Date();
      const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
      document.getElementById('currentDate').textContent = now.toLocaleDateString('ru-RU', options);
    }

    // === ЗАГРУЗКА ДАННЫХ С СЕРВЕРА ===
    function loadRealData() {
      document.getElementById('orderCount').textContent = 'Загрузка...';
      
      google.script.run
        .withSuccessHandler(onDataLoaded)
        .withFailureHandler(onDataError)
        .getOrders();
    }

    function onDataLoaded(data) {
      console.log('Данные загружены:', data);
      APP_DATA = normalizeData(data || []);
      
      updateOrderCount(APP_DATA.length);
      renderStats(APP_DATA);
      renderTables(APP_DATA);
    }

    function onDataError(error) {
      console.error('Ошибка загрузки:', error);
      document.getElementById('orderCount').textContent = 'Ошибка';
      alert('Не удалось загрузить данные: ' + error.message);
    }

    // Нормализация данных из таблицы
    function normalizeData(rawData) {
      return rawData.map((item, index) => ({
        id: item.id || index + 1,
        date: item.date || formatDate(item.startDate),
        day: item.day || getWeekday(item.startDate),
        order: item.order || item.product || 'Без названия',
        person: item.person || item.manager || item.constructorName || 'Не указан',
        role: detectRole(item),
        stage: item.stage || 'manager',
        notes: item.notes || item.comment || ''
      }));
    }

    function detectRole(item) {
      const person = (item.person || item.manager || item.constructorName || '').toLowerCase();
      if (person.includes('мен') || item.role === 'manager') return 'manager';
      return 'designer';
    }

    function formatDate(dateStr) {
      if (!dateStr) return '';
      const d = new Date(dateStr);
      if (isNaN(d)) return dateStr;
      return d.toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit' });
    }

    function getWeekday(dateStr) {
      if (!dateStr) return '';
      const d = new Date(dateStr);
      if (isNaN(d)) return '';
      return d.toLocaleDateString('ru-RU', { weekday: 'short' });
    }

    function updateOrderCount(count) {
      document.getElementById('orderCount').textContent = `Всего заказов: ${count}`;
    }

    // === РАСЧЕТ СТАТИСТИКИ ===
    function calculateStats(data) {
      const stats = {};
      
      data.forEach(item => {
        const name = item.person;
        if (!stats[name]) {
          stats[name] = { total: 0, tz: 0, proforma: 0, kd: 0, isManager: item.role === 'manager' };
        }
        
        stats[name].total++;
        
        if (item.stage === 'sergey' || item.stage === 'manager') stats[name].tz++;
        else if (item.stage === 'client') stats[name].proforma++;
        else if (item.stage === 'designer' || item.stage === 'workshop') stats[name].kd++;
      });

      return stats;
    }

    function renderStats(data) {
      const stats = calculateStats(data);
      const container = document.querySelector('.stats-grid');
      container.innerHTML = '';

      Object.keys(stats).forEach(name => {
        const s = stats[name];
        const icon = s.isManager ? '👩‍💼' : '🛠️';
        const color = s.isManager ? '#667eea' : '#7b1fa2';

        const card = document.createElement('div');
        card.className = 'stat-card';
        card.innerHTML = `
          <div class="stat-header">
            <span class="stat-icon">${icon}</span>
            <span>${name.replace(' (Мен)', '').replace(' (Кон)', '')}</span>
          </div>
          <div class="stat-badges">
            <span class="badge badge-total">📦 ${s.total}</span>
            <span class="badge badge-tz">ТЗ ${s.tz}</span>
            <span class="badge badge-proforma">📐 ${s.proforma}</span>
            <span class="badge badge-kd">КД ${s.kd}</span>
          </div>
        `;
        container.appendChild(card);
      });
    }

    // === ОТРИСОВКА ТАБЛИЦ ===
    function renderTables(data) {
      const managersTable = document.getElementById('managersTable');
      const constructorsTable = document.getElementById('constructorsTable');

      if (!data || data.length === 0) {
        managersTable.querySelector('tbody').innerHTML = '<tr><td colspan="5" style="text-align:center;padding:40px;">Заказов не найдено</td></tr>';
        constructorsTable.querySelector('tbody').innerHTML = '<tr><td colspan="5" style="text-align:center;padding:40px;">Заказов не найдено</td></tr>';
        return;
      }

      const managers = data.filter(i => i.role === 'manager');
      const designers = data.filter(i => i.role === 'designer');

      renderTableBody(managersTable, 'managers', managers);
      renderTableBody(constructorsTable, 'designers', designers);
    }

    function renderTableBody(tableElement, type, rows) {
      const tbody = tableElement.querySelector('tbody');
      
      if (!rows || rows.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;padding:20px;color:#666;">Нет заказов</td></tr>';
        tableElement.querySelector('.notes-block').style.display = 'none';
        return;
      }

      tableElement.querySelector('.notes-block').style.display = 'flex';

      const urgentNotes = rows.filter(r => r.notes && (r.notes.toLowerCase().includes('ждут') || r.names.toLowerCase().includes('срочно')));
      const notesText = urgentNotes.length > 0 
        ? `<strong>${urgentNotes.length} заказ(а):</strong> ${urgentNotes.map(n => n.notes).join('; ')}`
        : getSummaryNote(type, rows.length);

      tableElement.querySelector('.notes-text').innerHTML = notesText;

      tbody.innerHTML = rows.map(row => `
        <tr>
          <td>
            <div class="order-date">${row.date || '-'}</div>
            <div class="order-day">${row.day || ''}</div>
          </td>
          <td class="order-name">${row.order}</td>
          <td class="person-name">${row.person}</td>
          <td class="stage-cell">
            <div class="stage-buttons">
              ${STAGES.map(s => `
                <button class="stage-btn ${s.class} ${row.stage === s.id ? 'active' : ''}" 
                        onclick="setStage(this, ${row.id}, '${s.id}')">
                  ${s.label}
                </button>
              `).join('')}
            </div>
          </td>
          <td class="order-notes">${row.notes || '—'}</td>
        </tr>
      `).join('');
    }

    function getSummaryNote(type, count) {
      if (type === 'managers') {
        return `<strong>${count} заказ(ов)</strong> у менеджеров`;
      } else {
        return `<strong>${count} заказ(ов)</strong> в работе у конструкторов`;
      }
    }

    // === ОБРАБОТЧИКИ СОБЫТИЙ ===

    function setStage(btn, orderId, newStage) {
      btn.parentElement.querySelectorAll('.stage-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');

      const item = APP_DATA.find(i => i.id === orderId);
      if (item) {
        item.stage = newStage;
        
        google.script.run
          .withSuccessHandler(() => {
            console.log(`Стадия обновлена: Заказ ${orderId} -> ${newStage}`);
            const filteredData = currentFilter === 'all' ? APP_DATA : 
                                 currentFilter === 'managers' ? APP_DATA.filter(i => i.role === 'manager') :
                                 APP_DATA.filter(i => i.role === 'designer');
            renderStats(filteredData);
          })
          .withFailureHandler((err) => {
            alert('Ошибка сохранения: ' + err);
          })
          .saveStage(orderId, newStage);
      }
    }

    function filterBy(view) {
      currentFilter = view;
      
      document.getElementById('managersTable').style.display = view === 'managers' || view === 'all' ? 'block' : 'none';
      document.getElementById('constructorsTable').style.display = view === 'constructors' || view === 'all' ? 'block' : 'none';
      
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      event.target.classList.add('active');

      const filteredData = view === 'all' ? APP_DATA : 
                           view === 'managers' ? APP_DATA.filter(i => i.role === 'manager') :
                           APP_DATA.filter(i => i.role === 'designer');
      
      renderStats(filteredData);
      updateOrderCount(filteredData.length);
    }

    function resetAllStages() {
      if (confirm('Сбросить все стадии по умолчанию?')) {
        document.querySelectorAll('.stage-btn').forEach(btn => {
          btn.classList.remove('active');
          if (btn.textContent.includes('менеджера') || btn.textContent.includes('конструктора')) {
            btn.classList.add('active');
          }
        });
      }
    }
  </script>
</body>
</html>
